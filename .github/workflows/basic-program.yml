name: CI-C99 portable Linux 4 cells
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-opt1-c99-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizers: [OFF, ON]
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      # Auxiliary disposable proof PR only: execute A0 on the EXACT
      # synchronized production PR #236 SHA, never on this workflow patch.
      - name: J1-DIAG-RETRO-A1b-C1 exact HEAD A0 self-test (gcc OFF)
        if: matrix.compiler == 'gcc' && matrix.sanitizers == 'OFF'
        run: |
          set -euo pipefail
          git fetch --no-tags origin bd3216fe3ff5de538b632d3ec45fcd378cda6ebc
          git checkout --detach bd3216fe3ff5de538b632d3ec45fcd378cda6ebc
          echo 'J1-DIAG-A1b-C1 VERIFIED_SYNC_HEAD:'
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "bd3216fe3ff5de538b632d3ec45fcd378cda6ebc"
          python3 tools/j1_diag_retro_a0_verify.py --self-test
          echo 'J1-DIAG-A1b-C1 EXACT_HEAD_A0_SELF_TEST=PASS'
      - name: Configure
        run: |
          # Existing J0.23 host budget audit uses an anonymous struct inside
          # offsetof. Clang diagnoses that extension under -Werror; suppress
          # ONLY that unrelated diagnostic, keeping all other -Werror checks.
          flags="-fstack-usage"
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            flags="$flags -Wno-error=gnu-offsetof-extensions"
            # HW4-C3-A (already accepted in main) deliberately joins the
            # copyright glyph \x7f with its year in cpc_boot.c; Clang
            # warns about adjacent string literals under -Werror.
            flags="$flags -Wno-error=string-concatenation"
          fi
          cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug -DBP_SANITIZERS=${{ matrix.sanitizers }} "-DCMAKE_C_FLAGS=$flags"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Require full 62+ CTest inventory and developer labels
        run: |
          set -euo pipefail
          count="$(ctest --test-dir build -N | awk '/Total Tests:/ {print $3}')"
          test "$count" -ge 62
          ctest --test-dir build -N -L INTEGER | grep -F 'integer'
          ctest --test-dir build -N -L CPC_PERMANENT | grep -F 'cpc'
          ctest --test-dir build -N -L VIDEO | grep -F 'cpc_video'
          ctest --test-dir build -N -L UART | grep -F 'hw4_c2'
          ctest --test-dir build -N -L MEMORY | grep -F 'memory_budget'
          echo "CI-OPT1_CTEST_TOTAL=$count COMPILER=${{ matrix.compiler }} SANITIZERS=${{ matrix.sanitizers }}"
      - name: Original J1.2-B independent CPC boundary and native INTEGER16 diagnostics
        run: |
          set -euo pipefail
          python3 tools/j1_2_boundary_verify.py --permanent --self-test
          python3 tools/j1_2_b_native_verify.py --cli build/loco_basic_cli --image-cli build/basic_program_image_cli --self-test
      - name: HW4-C3-B1 original stand-alone C99 baseline (GCC OFF/ON)
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          set -euo pipefail
          flags="-std=c99 -Wall -Wextra -Wpedantic -Wconversion -Werror -g"
          if test "${{ matrix.sanitizers }}" = ON; then
            flags="$flags -fsanitize=address,undefined -fno-omit-frame-pointer"
          fi
          cc $flags -Ivideo -Iio \
            tests/test_hw4_c3_b1_baseline.c io/cpc_uart_console.c \
            video/cpc_text.c video/cpc_video.c video/cpc_palette.c \
            -o /tmp/hw4-c3-b1-baseline
          /tmp/hw4-c3-b1-baseline
      # CTest hides stdout of passing tests. Publish the intact-copy proof
      # and all 10+4 cause-specific rejection diagnostics on both CI variants.
      - name: J0.26-C2 audit self-test (visible positive and negative controls)
        run: python3 tools/j0_exit_audit.py --self-test
      - name: J0.28 positive live CLI, provenance and cause-specific falsifications
        run: |
          python3 tools/j0_post_c1_audit.py \
            --cli build/loco_basic_cli \
            --image-cli build/basic_program_image_cli --self-test
      - name: J1.1 signed INTEGER native/CPC independent differential audit
        run: |
          python3 tools/j1_signed_assignment_audit.py \
            --cli build/loco_basic_cli \
            --image-cli build/basic_program_image_cli --self-test
      - name: J0.23 memory audit (Linux host only)
        run: |
          cc --version | head -n 1
          cmake --version | head -n 1
          size --version | head -n 1
          ./build/basic_memory_budget
          echo '--- Host CLI ELF sections (includes libc/host overhead) ---'
          size -A build/loco_basic_cli | grep -E '^\.(text|rodata|data|bss)[[:space:]]|^Total'
          echo '--- Selected C99 stack usage: GCC static estimate per function ---'
          find build -path '*/CMakeFiles/basic_*.dir/core/*.su' -type f \
            -exec grep -H -E 'bt_tokenize|one_pass|explicit_variable|bl_list_program|render|be_step|execute_line|evaluate_integer_addition|bsr_submit|bsr_step|bs_process_line|bvb_read_explicit' {} + || true
          echo '--- Host-only CLI main stack allocation (NOT an ESP32 budget) ---'
          find build -name 'loco_basic_cli.c.su' -type f \
            -exec grep -H -E ':main[[:space:]]' {} + || true
