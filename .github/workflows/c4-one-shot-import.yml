name: J0.24-C4 one-shot import
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/c4-one-shot-import.yml"

# Temporary same-repo evidence import only. DELETE THIS FILE BEFORE REVIEW.
permissions:
  contents: write

concurrency:
  group: one-shot-c4-evidence
  cancel-in-progress: false

jobs:
  capture-and-promote:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/j0-24-c4-expanded-token-oracle'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/j0-24-c4-expanded-token-oracle
          submodules: recursive
          persist-credentials: true

      - name: Skip already promoted evidence (one-shot)
        shell: bash
        run: |
          if [ -e tests/fixtures/cpc6128/token_ram/a_print_constants/program.bin ]; then
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Install pinned emulator prerequisites
        if: env.SKIP != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev xvfb xauth python3

      - name: Build and verify Caprice32 identity
        if: env.SKIP != '1'
        working-directory: tests/oracles/caprice32
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          make -j 2 WITHOUT_GL=1 APP_PATH="$PWD"
          test "$(sha256sum rom/cpc6128.rom | cut -d' ' -f1)" = "31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562"

      - name: Build and test portable C99 with unchanged sources
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/c99-build"
          cmake --build "$RUNNER_TEMP/c99-build" -j 2
          ctest --test-dir "$RUNNER_TEMP/c99-build" --output-on-failure

      - name: Acquire five independent original CPC memory images
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          python3 tests/oracles/token_ram_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --output "$RUNNER_TEMP/c4-original"
          python3 tools/cpc_token_evidence.py --evidence "$RUNNER_TEMP/c4-original" --self-test

      - name: Upload original run evidence (including SHA manifest and LIST witnesses)
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c4-original-evidence
          path: ${{ runner.temp }}/c4-original/
          if-no-files-found: error
          retention-days: 14

      - name: Archive originals directly on their acquisition runner
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          python3 tools/promote_token_ram_c4.py \
            --evidence "$RUNNER_TEMP/c4-original" --run-id "$GITHUB_RUN_ID"
          python3 tools/cpc_token_evidence.py --permanent --self-test
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" --ci

      - name: Commit only C4 delimited tokens and audited metadata
        if: env.SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cpc6128/token_ram/a_print_constants \
                  tests/fixtures/cpc6128/token_ram/f_let_spacing \
                  tests/fixtures/cpc6128/token_ram/f_mixed_case \
                  tests/fixtures/cpc6128/token_ram/manifest.json \
                  tests/fixtures/cpc6128/manifest.json \
                  docs/J0.24-C4-extended-token-oracle.md docs/PROJECT_STATUS.md
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "test(J0.24-C4): archive three original CPC token RAM captures"
          git push origin HEAD:feat/j0-24-c4-expanded-token-oracle
