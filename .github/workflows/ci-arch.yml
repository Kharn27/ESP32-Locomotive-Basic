name: CI-ARCH core HW4 CPC isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-opt1-arch-${{ github.event.pull_request.number || github.ref }
  cancel-in-progress: ${{ github.event_name == 'pull_request' }

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CPC archive changes must be additions under NEW directories; old history immutable
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          while IFS=$'\t' read -r status path; do
            test -n "$status" || continue
            case "$status" in
              A) ;;
              *) echo "CI_ARCH_EXISTING_CPC_PROOF_CHANGED $status $path"; exit 1 ;;
            esac
            case "$path" in
              tests/fixtures/cpc6128/*/*)
                folder="tests/fixtures/cpc6128/${path#tests/fixtures/cpc6128/}"
                folder="${folder%%/*}"
                folder="tests/fixtures/cpc6128/$folder"
                if git cat-file -e "$base:$folder" 2>/dev/null; then
                  echo "CI_ARCH_OLD_ARCHIVE_ADDITION_FORBIDDEN $path"; exit 1
                fi ;;
              *) echo "CI_ARCH_UNSCOPED_CPC_ADDITION $path"; exit 1 ;;
            esac
          done < <(git diff --name-status "$base" HEAD -- tests/fixtures/cpc6128/)
          # Existing emulator, original oracle scripts and promotion tools remain sealed.
          # Addition of a NEW oracle script is permissible; overwriting is not.
          while IFS=$'\t' read -r status path; do
            test -n "$status" || continue
            case "$status" in
              A) ;;
              *) echo "CI_ARCH_EXISTING_ORACLE_CHANGED $status $path"; exit 1 ;;
            esac
          done < <(git diff --name-status "$base" HEAD -- tests/oracles/)
      - name: Shared LCD transport, unique firmware entry point and product/core boundary
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main firmware/esp32_probe/main --include='*.c'
          test "$(grep -c '^void app_main(void)' firmware/esp32_display_probe/main/hw4_c2_console.c)" -eq 1
          test ! -e firmware/esp32_loco/CMakeLists.txt
          ! grep -RE 'esp_lcd_new_panel_ili9341' firmware/esp32_display_probe/main/ --include='*.c'
          ! grep -RE 'malloc[()]|calloc[()]|realloc[()]|free[()]' io/uart_line.c io/cpc_uart_console.c firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_submit(' firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_step(' firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'UART_ANSI_CSI' io/uart_line.c
          grep -F 'cpc_uart_console_backspace' firmware/esp32_display_probe/main/hw4_c2_console.c
          if git diff --name-only "$base" HEAD -- io/ video/ firmware/ tests/test_hw4_c2_integration.c tests/test_hw4_c1_integration.c | grep -q .; then
            git diff --exit-code "$base" HEAD -- core/
          fi
          echo "CI_ARCH_LCD_OWNER=1 ARCHIVE_EXISTING_IMMUTABLE=PASS"
