name: CI-CPC-PERMANENT sealed CPC history

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-opt1-permanent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'oracle/j1-19-a-paper-cpc' }}

jobs:
  sealed-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: J0 provenance, SHA, printer/RUN/LIST and coordinated falsifications
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cpc_evidence.py --self-test
          python3 tools/cpc_token_evidence.py --permanent --self-test
          python3 tests/oracles/cpc_run_evidence.py --evidence tests/fixtures/cpc6128/run_behavior --permanent --self-test
          python3 tests/oracles/cpc_list_evidence.py --evidence tests/fixtures/cpc6128/list_printer --permanent --self-test
          python3 tests/oracles/cpc_screen_evidence.py --evidence tests/fixtures/cpc6128/list_screen --permanent --self-test
          python3 tests/oracles/signed_print_evidence.py --evidence tests/fixtures/cpc6128/signed_print --permanent --self-test
          python3 tools/j0_exit_audit.py --self-test
      - name: J1.2-J1.5 original ROM CPC images, anchors and negative controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_2_boundary_verify.py --permanent --self-test
          python3 tools/j1_3_subtraction_verify.py --permanent --self-test
          python3 tools/j1_4_multiplication_verify.py --permanent --self-test
          python3 tools/j1_5_division_verify.py --permanent --self-test
      - name: J1.6-J1.9 immutable ROM captures and fake-HEAD rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_6_mod_verify.py --permanent --self-test
          python3 tools/j1_7_add_vars_verify.py --permanent --self-test
          python3 tools/j1_8_sub_vars_verify.py --permanent --self-test
          python3 tools/j1_9_binary_family_verify.py --permanent --self-test
      - name: J1.10-J1.11 flow-control historical CPC; fail closed
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_10_if_then_verify.py --permanent --self-test
          python3 tools/j1_11_gosub_return_verify.py --permanent --self-test

      - name: J1.12-A FOR NEXT sealed CPC ROM captures and falsifications
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_12_for_next_verify.py --permanent --self-test

      - name: J1.13-A independent INTEGER relational IF oracle (when sealed)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_13_relational_if_verify.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_13_integer_relations/manifest.json; then
            python3 tools/j1_13_relational_if_verify.py --permanent --self-test
          else
            echo 'J1.13-A CPC_ARCHIVE_PENDING: no historical oracle PASS claimed'
          fi

      - name: J1.14-A independent IF inline ELSE CPC oracle (fail closed when archived)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_14_if_inline_else_verify.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_14_if_inline_else/manifest.json; then
            python3 tools/j1_14_if_inline_else_verify.py --permanent --self-test
          else
            echo 'J1.14-A ORIGINAL_ARCHIVE_PENDING: no CPC proof claimed'
          fi

      - name: J1.15-A independent scalar STRING CPC oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_15_string_scalar_verify.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_15_string_scalar/manifest.json; then
            python3 tools/j1_15_string_scalar_verify.py --permanent --self-test
          else
            echo 'J1.15-A ORIGINAL_ARCHIVE_PENDING: no ROM proof claimed'
          fi

      - name: J1.16-E-A CPC zero/one/negative one store — external SHA seal
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_16_e_a_store.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_16_e_a_small_store/manifest.json; then
            python3 tools/j1_16_e_a_store.py --evidence tests/fixtures/cpc6128/j1_16_e_a_small_store --permanent --self-test
          else
            echo 'J1.16-E-A ARCHIVE_NOT_YET_ACQUIRED — SOURCE_ONLY NOT STORE VERIFIED'
          fi

      - name: J1.16-D-A signed store — immutable CPC variable windows and mutations
        shell: bash
        run: |
          set -euo pipefail
          if test -f tests/fixtures/cpc6128/j1_16_d_a_negative_store/manifest.json; then
            python3 tools/j1_16_d_a_store.py --evidence tests/fixtures/cpc6128/j1_16_d_a_negative_store --permanent --self-test
          else
            echo 'J1.16-D-A STORE_UNVERIFIED: no original store archive'
          fi

      - name: J1.17-A permanently sealed PEN CPC witness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_17_a_pen_evidence.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_17_a_pen/manifest.json; then
            python3 tools/j1_17_a_pen_evidence.py --evidence tests/fixtures/cpc6128/j1_17_a_pen --permanent --self-test
            python3 tools/j1_17_a_pen_pixels.py --evidence tests/fixtures/cpc6128/j1_17_a_pen --self-test
          else
            echo 'J1.17-A ARCHIVE_NOT_YET_ACQUIRED — CPC_UNVERIFIED'
          fi
      - name: J1.17-C-A PEN 5..14 MODE1 externally pinned CPC archive
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_17_c_a_pen_oracle.py --check-sources
          python3 tools/j1_17_c_a_pen_oracle.py --evidence tests/fixtures/cpc6128/j1_17_c_a_pen --permanent --self-test
          echo 'J1.17-C-A EXTERNALLY_SEALED_52_CPC_SESSIONS_VERIFIED'
      - name: J1.18-A INK independent oracle — external SHA seal (when archived)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_18_a_ink_evidence.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_18_a_ink/manifest.json; then
            python3 tools/j1_18_a_ink_evidence.py --evidence tests/fixtures/cpc6128/j1_18_a_ink --permanent --self-test
            python3 tools/j1_18_a_ink_pixels.py --evidence tests/fixtures/cpc6128/j1_18_a_ink --self-test
            echo 'J1.18-A INK_EXTERNALLY_SEALED_ORACLE_PASS'
          else
            echo 'J1.18-A INK_ARCHIVE_PENDING — NO_CPC_ORACLE_PASS_CLAIM'
          fi

      - name: J1.20-A ABS signed INTEGER ROM evidence (external seal required)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_20_a_abs_evidence.py --check-sources
          if test -f tests/fixtures/cpc6128/j1_20_a_abs/manifest.json; then
            python3 tools/j1_20_a_abs_evidence.py \
              --evidence tests/fixtures/cpc6128/j1_20_a_abs --permanent --self-test
            echo 'J1.20-A ABS_EXTERNALLY_SEALED_ORACLE_PASS'
          else
            echo 'J1.20-A ABS_ARCHIVE_PENDING — NO CPC ORACLE PASS CLAIM'
          fi

  pen-cpc-acquisition:
    if: (github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-17-a-pen-cpc' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'oracle/j1-17-a-pen-cpc')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Pin ROM, emulator, HEAD and prove no runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee /tmp/j117-paths.txt
          if grep -E '^(core/|video/|firmware/|hal/|io/|tests/oracles/caprice32/|tests/fixtures/cpc6128/j1_16_|tools/j1_16_)' /tmp/j117-paths.txt; then
            echo 'J1.17-A FORBIDDEN_DIFF_PATH'; exit 1
          fi
          python3 tools/j1_17_a_pen_evidence.py --check-sources --expect-head "$GITHUB_HEAD_SHA"
          echo 'J1.17-A PINNED_HEAD_ROM_CAPRICE_SCOPE_PASS'
      - name: Acquire two independent fresh CPC sessions per PEN case
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_17_a_pen_evidence.py \
            --caprice tests/oracles/caprice32 \
            --output "$RUNNER_TEMP/j117-pen" --expect-head "$GITHUB_HEAD_SHA"
          python3 tools/j1_17_a_pen_evidence.py \
            --evidence "$RUNNER_TEMP/j117-pen" --self-test
          python3 tools/j1_17_a_pen_pixels.py --evidence "$RUNNER_TEMP/j117-pen" --self-test
          echo 'J1.17-A FRESH_16_SESSIONS_VERIFIED UNSEALED'
      - name: Archive once; thereafter require immutable external seal and fresh re-acquisition
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_17_a_pen
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j117-pen/." "$DEST/"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name 'cap32.cfg' \) | grep .
            python3 tools/j1_17_a_pen_evidence.py --evidence "$DEST" --self-test
            echo 'J1.17-A ARCHIVE_CREATED_PENDING_EXTERNAL_PIN'
            find "$DEST" -type f -print0 | sort -z | xargs -0 sha256sum | tee /tmp/j117-file-shas.txt
            git config user.name 'loco-cyd-evidence-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DEST"
            git commit -m 'evidence(J1.17-A): archive 16 genuine CPC PEN sessions'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-17-a-pen-cpc | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo 'CONCURRENT_HEAD_ADVANCE_ARCHIVE_NOT_PUSHED'; exit 1;
            }
            git push origin HEAD:refs/heads/oracle/j1-17-a-pen-cpc
          else
            python3 tools/j1_17_a_pen_evidence.py --evidence "$DEST" --permanent --self-test
            for case in P00 P01 P02 P03 P04 P15 P16 PN1; do
              for sess in original repeat; do
                cmp "$DEST/$sess/$case/program.bin" "$RUNNER_TEMP/j117-pen/$sess/$case/program.bin"
                cmp "$DEST/$sess/$case/run/printer.dat" "$RUNNER_TEMP/j117-pen/$sess/$case/run/printer.dat"
              done
              echo "J1.17-A $case FRESH_RAM_AND_ERR_ERL_MATCH_ARCHIVE"
            done
            echo 'J1.17-A EXTERNALLY_SEALED_PERMANENT_AND_FRESH_PASS'
          fi
      - name: Preserve bounded CPC oracle evidence for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j117-a-pen-16-sessions
          path: ${{ runner.temp }}/j117-pen/
          if-no-files-found: warn
          retention-days: 30

  ink-cpc-acquisition:
    if: (github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-18-a-ink-cpc' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'oracle/j1-18-a-ink-cpc')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Pin Caprice32 ROM, HEAD and oracle-only diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee /tmp/j118-paths.txt
          if grep -E '^(core/|video/|firmware/|hal/|io/|bsr_|tests/oracles/caprice32/|tests/fixtures/cpc6128/j1_17_|tests/fixtures/cpc6128/j1_16_|tools/j1_17_|tools/j1_16_)' /tmp/j118-paths.txt; then
            echo 'J1.18-A FORBIDDEN_DIFF_PATH'; exit 1
          fi
          python3 tools/j1_18_a_ink_evidence.py --check-sources --expect-head "$GITHUB_HEAD_SHA"
          echo 'J1.18-A INK_HEAD_ROM_CAPRICE_SCOPE_PASS'
      - name: Acquire 26 fresh CPC sessions and two independent two-frame recolor experiments
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_18_a_ink_evidence.py --caprice tests/oracles/caprice32 \
            --output "$RUNNER_TEMP/j118-ink" --expect-head "$GITHUB_HEAD_SHA"
          python3 tools/j1_18_a_ink_evidence.py --evidence "$RUNNER_TEMP/j118-ink" --self-test
          python3 tools/j1_18_a_ink_pixels.py --evidence "$RUNNER_TEMP/j118-ink" \
            --report "$RUNNER_TEMP/j118-rgb-observations.json" --self-test
          echo 'J1.18-A FRESH_26_CASE_SESSIONS_2_CHRONOLOGY_PASS UNSEALED'
      - name: First archival commit or immutable external seal plus fresh comparison
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_18_a_ink
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j118-ink/." "$DEST/"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name 'cap32.cfg' \) | grep .
            python3 tools/j1_18_a_ink_evidence.py --evidence "$DEST" --self-test
            echo 'J1.18-A ARCHIVE_CREATED_PENDING_EXTERNAL_PINS'
            find "$DEST" -type f -print0 | sort -z | xargs -0 sha256sum | tee /tmp/j118-file-shas.txt
            sha256sum "$DEST/manifest.json" | tee /tmp/j118-manifest-sha.txt
            git config user.name 'loco-cyd-evidence-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DEST"
            git commit -m 'evidence(J1.18-A): archive 26 genuine CPC INK sessions and two chronology captures'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-18-a-ink-cpc | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo 'CONCURRENT_HEAD_ADVANCE_ARCHIVE_NOT_PUSHED'; exit 1;
            }
            git push origin HEAD:refs/heads/oracle/j1-18-a-ink-cpc
          else
            python3 tools/j1_18_a_ink_evidence.py --evidence "$DEST" --permanent --self-test
            for case in I00 I126 I106 I206 I318 I1526 I127 I131 I1266 I1626 IN126 I132 I1N1; do
              for sess in original repeat; do
                cmp "$DEST/$sess/$case/program.bin" "$RUNNER_TEMP/j118-ink/$sess/$case/program.bin"
                cmp "$DEST/$sess/$case/run/printer.dat" "$RUNNER_TEMP/j118-ink/$sess/$case/run/printer.dat"
              done
              echo "J1.18-A $case FRESH_RAM_AND_ERR_ERL_MATCH_ARCHIVE"
            done
            echo 'J1.18-A EXTERNALLY_SEALED_AND_FRESH_PASS'
          fi
      - name: Preserve raw fresh INK evidence and independent pixel results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j118-a-ink-fresh-26-sessions
          path: |
            ${{ runner.temp }}/j118-ink/
            ${{ runner.temp }}/j118-rgb-observations.json
          if-no-files-found: warn
          retention-days: 30

  abs-cpc-acquisition:
    if: (github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-20-a-abs-integer' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'oracle/j1-20-a-abs-integer')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Pin CPC6128 ROM, emulator, acquisition HEAD and oracle-only scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee /tmp/j120-abs-files.txt
          if grep -E '^(core/|video/|integration/|firmware/|hal/|io/|tests/oracles/caprice32/|tests/fixtures/cpc6128/j1_1[0-9]_|tests/fixtures/cpc6128/j1_2_|tests/fixtures/cpc6128/j1_19_|tools/j1_19_)' /tmp/j120-abs-files.txt; then
            echo 'J1.20-A FORBIDDEN_SCOPE_DIFF'; exit 1
          fi
          python3 tools/j1_20_a_abs_evidence.py --check-sources --expect-head "$GITHUB_HEAD_SHA"
          echo 'J1.20-A BASE_PINNED_SCOPE_PASS'
      - name: Re-acquire 16 ABS cases twice with independent CPC processes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_20_a_abs_evidence.py --caprice tests/oracles/caprice32 \
            --output "$RUNNER_TEMP/j120-abs" --expect-head "$GITHUB_HEAD_SHA"
          python3 tools/j1_20_a_abs_evidence.py --evidence "$RUNNER_TEMP/j120-abs" --self-test
          echo 'J1.20-A FRESH_32_CPC_SESSIONS_UNSEALED'
      - name: Archive original captures once, otherwise compare permanent evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_20_a_abs
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j120-abs/." "$DEST/"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name 'cap32.cfg' \) | grep .
            python3 tools/j1_20_a_abs_evidence.py --evidence "$DEST" --self-test
            echo 'J1.20-A ARCHIVE_CREATED_PENDING_EXTERNAL_SHA_PINS'
            find "$DEST" -type f -print0 | sort -z | xargs -0 sha256sum | tee /tmp/j120-abs-file-shas.txt
            git config user.name 'loco-cyd-evidence-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DEST"
            git commit -m 'evidence(J1.20-A): archive 32 authentic CPC ABS sessions'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-20-a-abs-integer | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo 'CONCURRENT_HEAD_ADVANCE_ARCHIVE_NOT_PUSHED'; exit 1;
            }
            git push origin HEAD:refs/heads/oracle/j1-20-a-abs-integer
          else
            python3 tools/j1_20_a_abs_evidence.py --evidence "$DEST" --permanent --self-test
            for case in A00 A01 AN1 V07 VN7 VMAX VNMAX VMIN B07 BN7 BMIN IMIN L20 EMPTY STRING MULTI; do
              for sess in original repeat; do
                cmp "$DEST/$sess/$case/program.bin" "$RUNNER_TEMP/j120-abs/$sess/$case/program.bin"
                cmp "$DEST/$sess/$case/run/printer.dat" "$RUNNER_TEMP/j120-abs/$sess/$case/run/printer.dat"
              done
            done
            echo 'J1.20-A EXTERNALLY_SEALED_PERMANENT_AND_FRESH_MATCH'
          fi
      - name: Upload raw original and repeated CPC ABS observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j120-a-abs-32-independent-sessions
          path: ${{ runner.temp }}/j120-abs/
          if-no-files-found: warn
          retention-days: 30

  paper-cpc-acquisition:
    if: (github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-19-a-paper-cpc' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref_name == 'oracle/j1-19-a-paper-cpc')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Pin exact PAPER branch HEAD, CPC6128 ROM, Caprice32 source and safe diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.head_ref }}" = oracle/j1-19-a-paper-cpc
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee /tmp/j119-paper-paths.txt
          if grep -E '^(core/|video/|firmware/|integration/|hal/|io/|CMakeLists.txt$|tests/oracles/caprice32/|tests/fixtures/cpc6128/j1_17_|tests/fixtures/cpc6128/j1_18_|tools/j1_17_|tools/j1_18_)' /tmp/j119-paper-paths.txt; then
            echo 'J1.19-A FORBIDDEN_DIFF_PATH'; exit 1
          fi
          python3 tools/j1_19_a_paper_oracle.py --check-sources
          python3 -m unittest discover -s tests -p 'test_j1_19_a_paper_oracle.py' -q
          echo 'J1.19-A ROM_CAPRICE_HEAD_AND_SCOPE_PASS'
      - name: Acquire 24 independent PAPER cases plus direct and chronology checks from real CPC
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_19_a_paper_oracle.py --acquire tests/oracles/caprice32 \
            --output "$RUNNER_TEMP/j119-paper" --head "$GITHUB_HEAD_SHA"
          python3 tools/j1_19_a_paper_oracle.py --evidence "$RUNNER_TEMP/j119-paper"
          ! find "$RUNNER_TEMP/j119-paper" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name cap32.cfg \) | grep .
          find "$RUNNER_TEMP/j119-paper" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/j119-paper-origin-sha256.txt"
          sha256sum "$RUNNER_TEMP/j119-paper/manifest.json" > "$RUNNER_TEMP/j119-paper-manifest-sha256.txt"
          printf 'GITHUB_RUN_ID=%s\nGITHUB_HEAD_SHA=%s\nCAPRICE_PIN=%s\n' "$GITHUB_RUN_ID" "$GITHUB_HEAD_SHA" 8c778bf072a06fb7c23b9cccd179041db7f79a52 > "$RUNNER_TEMP/j119-paper-origin.txt"
          echo 'J1.19-A FRESH_24_CASE_SESSIONS_DIRECT_CHRONOLOGY_PASS UNSEALED'
      - name: Archive first real acquisition with race protection or compare externally sealed evidence
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_19_a_paper
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j119-paper/." "$DEST/"
            python3 tools/j1_19_a_paper_oracle.py --evidence "$DEST"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name cap32.cfg \) | grep .
            git config user.name loco-cyd-evidence-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$DEST"
            git commit -m 'evidence(J1.19-A): archive 24 genuine PAPER CPC sessions'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-19-a-paper-cpc | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo 'J1.19-A CONCURRENT_HEAD_ADVANCE_ARCHIVE_NOT_PUSHED'; exit 1;
            }
            git push origin HEAD:refs/heads/oracle/j1-19-a-paper-cpc
            echo 'J1.19-A ARCHIVE_PENDING_EXTERNAL_SEAL'
            echo 'J1.19-A GITHUB_TOKEN_PUSH_DOES_NOT_AUTOMATICALLY_TRIGGER_PR_CI'
          else
            python3 tools/j1_19_a_paper_oracle.py --evidence "$DEST" --permanent --self-test
            python3 - "$DEST" "$RUNNER_TEMP/j119-paper" <<'PY'
          import json, pathlib, sys
          old, fresh = map(pathlib.Path, sys.argv[1:])
          manifest=json.loads((old/'manifest.json').read_text())
          for sess in ('original','repeat'):
              for case in manifest['cases']:
                  for f in ('program.bin','list/printer.dat','run/printer.dat'):
                      assert (old/sess/case/f).read_bytes() == (fresh/sess/case/f).read_bytes(), (case,sess,f)
                  oldcap=json.loads((old/sess/case/'capture.json').read_text())
                  newcap=json.loads((fresh/sess/case/'capture.json').read_text())
                  for p in ('run/screen.png','baseline/screen.png','list/screen.png'):
                      for key in ('rgb_histogram','blank_rgb_histogram'):
                          assert oldcap['visual'][p][key]==newcap['visual'][p][key], (case,sess,p,key)
          print('J1.19-A FRESH_REACQUISITION_RAM_LIST_ERR_ERL_RGB_MATCH_ARCHIVE')
          PY
            echo 'J1.19-A EXTERNALLY_SEALED_PASS'
          fi
      - name: Preserve untouched original PAPER CPC capture and external run SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j119-paper-cpc-original-${{ github.run_id }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/j119-paper/
            ${{ runner.temp }}/j119-paper-origin-sha256.txt
            ${{ runner.temp }}/j119-paper-manifest-sha256.txt
            ${{ runner.temp }}/j119-paper-origin.txt
          if-no-files-found: warn
          retention-days: 90
