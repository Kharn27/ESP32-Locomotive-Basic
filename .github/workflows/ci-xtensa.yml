name: CI-XTENSA U1-B three profiles one ESP-IDF root

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-opt1-xtensa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  profile-guards:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Profiles, obsolete-path and partition negative tests
        run: |
          set -euo pipefail
          python3 tools/ci/check_loco_cyd_profiles.py --self-test
          python3 tools/ci/check_u1b_retirement.py --self-test
          python3 tools/ci/check_u1b_retirement.py --scan
          python3 tools/ci/test_u1b_partition.py
          python3 tools/ci/check_u1b_memory.py --self-test

  three-profiles:
    needs: profile-guards
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: CONSOLE
            tag: console
          - profile: HW3
            tag: hw3
          - profile: BASIC_PROBE
            tag: basic
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and check Xtensa ESP-IDF v5.5.6 profile ${{ matrix.profile }}
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE: ${{ matrix.profile }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project -e EXPECTED_HEAD="$EXPECTED_HEAD" \
            -e PROFILE="$PROFILE" -e TAG="$TAG" espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              cd /project/firmware/esp32_display_probe
              dir="build-u1-$TAG"
              out="reports/u1-b/$TAG"
              config="$PWD/sdkconfig.u1-$TAG"
              mkdir -p "$out"
              idf.py -B "$dir" -DSDKCONFIG="$config" -DLOCO_CYD_PROFILE="$PROFILE" set-target esp32 > "$out/set-target.log" 2>&1
              idf.py -B "$dir" -DSDKCONFIG="$config" -DLOCO_CYD_PROFILE="$PROFILE" build > "$out/build.log" 2>&1
              idf.py -B "$dir" size > "$out/size.txt" 2>&1
              python3 /project/tools/ci/check_u1b_memory.py "$PROFILE" "$out/size.txt" | tee "$out/memory-parity.txt"
              idf.py -B "$dir" size-components > "$out/size-components.txt" 2>&1
              grep -Fx "LOCO_CYD_PROFILE:STRING=$PROFILE" "$dir/CMakeCache.txt"
              test -s "$dir/loco_esp32_display_probe.bin"
              test -s "$dir/loco_esp32_display_probe.elf"
              xtensa-esp-elf-nm --defined-only "$dir/loco_esp32_display_probe.elf" |
                python3 /project/tools/ci/check_loco_cyd_profiles.py --nm
              python3 /project/tools/ci/verify_esp_app_version.py \
                "$dir/loco_esp32_display_probe.bin" "$EXPECTED_HEAD" loco_esp32_display_probe
              xtensa-esp-elf-readelf -h "$dir/loco_esp32_display_probe.elf" > "$out/elf-header.txt"
              xtensa-esp-elf-readelf -S -W "$dir/loco_esp32_display_probe.elf" > "$out/elf-sections.txt"
              sha256sum "$dir/loco_esp32_display_probe.bin" > "$out/binary-sha256.txt"
              python3 /project/tools/ci/check_build.py \
                "$config" partitions.csv "$dir/loco_esp32_display_probe.bin" > "$out/partitions.txt"
              if test "$PROFILE" = "CONSOLE"; then
                grep -Fx "CONFIG_ESP_MAIN_TASK_STACK_SIZE=6144" "$config"
                if idf.py -B build-u1-invalid -DLOCO_CYD_PROFILE=INVALID reconfigure > "$out/invalid.log" 2>&1; then
                  echo "U1-B invalid profile unexpectedly compiled"; exit 1
                fi
                grep -F "U1-A invalid LOCO_CYD_PROFILE" "$out/invalid.log"
                if idf.py -B build-u1-conflict -DLOCO_CYD_PROFILE=HW3 -DHW4_C2_CONSOLE=ON reconfigure > "$out/conflict.log" 2>&1; then
                  echo "U1-B conflicting selectors unexpectedly compiled"; exit 1
                fi
                grep -F "U1-A conflicting selectors" "$out/conflict.log"
              fi
              if test "$PROFILE" = "BASIC_PROBE"; then
                python3 /project/tools/ci/report_abi.py "$dir/loco_esp32_display_probe.elf" > "$out/xtensa-abi.txt"
                xtensa-esp-elf-nm --defined-only "$dir/loco_esp32_display_probe.elf" | grep -F " loco_probe_abi_sizes"
                test "$(grep -Ec "^[A-Za-z_0-9]+=[0-9]+ bytes$" "$out/xtensa-abi.txt")" -eq 16
                grep -Fx "LocoProbeStorage=19072 bytes" "$out/xtensa-abi.txt"
                grep -Fx "core_descriptor_bytes=636" "$out/xtensa-abi.txt"
                grep -Fx "owned_buffers_and_entries_bytes=18432" "$out/xtensa-abi.txt"
                if python3 /project/tools/ci/report_abi.py partitions.csv > "$out/abi-negative.log" 2>&1; then
                  echo "U1-B invalid ELF was accepted"; exit 1
                fi
              fi
              echo "U1-B PROFILE_$PROFILE=PASS"
            '
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: arch-hw4-u1-b-${{ matrix.tag }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_display_probe/reports/u1-b/${{ matrix.tag }}/
            firmware/esp32_display_probe/build-u1-${{ matrix.tag }}/loco_esp32_display_probe.elf
            firmware/esp32_display_probe/build-u1-${{ matrix.tag }}/loco_esp32_display_probe.bin

  # HW4-EDIT-A: reproduce the PO's *existing* ESP-IDF project and standard
  # VS Code "Build" action (idf.py build => default build/ cache).
  # Run main -> PR in one and the same workspace, with no fullclean, -B,
  # additional project, or custom configuration. A CI-only test: no flash.
  po-standard-build:
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/hw4-edit-a-cpc-cursor' || github.head_ref == 'feat/hw4-edit-p1-semantic-cells' || github.head_ref == 'feat/arch-hw4-u1-a-unified-profiles' || github.head_ref == 'feat/arch-hw4-u1-b-retire-legacy-probe' || github.head_ref == 'feat/hw4-edit-b1-a-screen-navigation')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Branch-switch smoke in existing display probe and default build cache
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EDIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EDIT_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git switch --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project -e EXPECTED_BASE="$BASE_SHA" espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              cd firmware/esp32_display_probe
              idf.py --version
              # Identical project, normal build/ directory, default ON.
              idf.py build
              grep -Fx "HW4_C2_CONSOLE:BOOL=ON" build/CMakeCache.txt
              test -s build/loco_esp32_display_probe.bin
              test "$(xtensa-esp-elf-nm --defined-only build/loco_esp32_display_probe.elf | grep -Ec " [TW] app_main$")" -eq 1
            '
          git switch --detach "$EDIT_SHA"
          test "$(git rev-parse HEAD)" = "$EDIT_SHA"
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project -e EXPECTED_HEAD="$EDIT_SHA" \
            espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              cd firmware/esp32_display_probe
              idf.py build
              grep -Fx "HW4_C2_CONSOLE:BOOL=ON" build/CMakeCache.txt
              test -s build/loco_esp32_display_probe.bin
              test "$(xtensa-esp-elf-nm --defined-only build/loco_esp32_display_probe.elf | grep -Ec " [TW] app_main$")" -eq 1
              python /project/tools/ci/verify_esp_app_version.py build/loco_esp32_display_probe.bin "$EXPECTED_HEAD" loco_esp32_display_probe
              echo "PO_STANDARD_PROJECT=firmware/esp32_display_probe"
              echo "PO_STANDARD_CMD=idf.py build"
              echo "PO_STANDARD_CACHE=build"
              echo "PO_STANDARD_SOURCE_SHA=$EXPECTED_HEAD"
              echo "PO_STANDARD_ON=PASS"
            '
          git switch --detach "$EDIT_SHA"
          test "$(git rev-parse HEAD)" = "$EDIT_SHA"

