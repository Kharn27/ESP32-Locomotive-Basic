name: C2 one-shot evidence import
on:
  pull_request:
    paths: [".github/workflows/cpc-evidence-bootstrap.yml"]
permissions:
  contents: write
  actions: read
jobs:
  archive:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/j0-24-c2-persistent-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: cpc6128-caprice32-evidence
          run-id: 40207538056
          repository: Kharn27/ESP32-Locomotive-Basic
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source-oracle
      - name: Bootstrap checked source and archive raw proofs
        env:
          SOURCE_DIR: ${{ runner.temp }}/source-oracle
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          blob=""
          dest=pathlib.Path("tools/cpc_evidence.py")
          dest.write_bytes(gzip.decompress(base64.b64decode(blob)))
          PY
          python3 tools/cpc_evidence.py --archive "$SOURCE_DIR" --self-test
      - name: Commit original binary proof to this PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/cpc_evidence.py tests/fixtures/cpc6128/evidence/
          git commit -m "test(J0.24-C2): preserve original Caprice32 evidence and SHA provenance"
          git push origin HEAD:feat/j0-24-c2-persistent-evidence
