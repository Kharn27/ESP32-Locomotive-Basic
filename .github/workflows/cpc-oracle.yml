name: CPC 6128 independent oracle

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "tests/oracles/**"
      - ".github/workflows/cpc-oracle.yml"
      - "tools/cpc_token_evidence.py"
      - "tests/fixtures/cpc6128/**"
      - "docs/J0.24-C3-cpc-token-memory.md"
      - "docs/J0.24-C4-extended-token-oracle.md"
      - "docs/J0.24-C5-eight-case-oracle.md"
      - "docs/J0.24-C6-run-behavior-oracle.md"
      - "docs/J0.24-C7-list-oracle.md"
      - "docs/J0.24-C8-list-screen-evidence.md"
      - "tools/promote_token_ram_c5.py"
      - "tools/promote_token_ram_c4.py"
      - "docs/J0.24-C1-caprice32-oracle-automation.md"
      - "core/basic_executor.c"
      - "tests/test_basic_integer_variable_print.c"
      - "tests/test_basic_integer_expression_runtime.c"
      - "tests/test_loco_basic_cli.cmake"
      - "docs/J0.27-C1-integer-print-format.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caprice32-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned emulator submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned Caprice32 revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          git ls-tree HEAD tests/oracles/caprice32
          test "$(git ls-tree HEAD tests/oracles/caprice32 | awk '{print $1}')" = "160000"

      - name: Install upstream Linux build dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev xvfb xauth python3

      - name: Build Caprice32 from pinned source
        working-directory: tests/oracles/caprice32
        run: |
          set -euo pipefail
          make -j 2 WITHOUT_GL=1 APP_PATH="$PWD"
          ./cap32 --version
          test -s rom/cpc6128.rom
          sha256sum rom/cpc6128.rom
          test -s rom/amsdos.rom
          sha256sum rom/amsdos.rom

      - name: Build portable C99 comparator
        run: |
          set -euo pipefail
          cmake -S . -B "${RUNNER_TEMP}/c99-build"
          cmake --build "${RUNNER_TEMP}/c99-build" -j 2
          ctest --test-dir "${RUNNER_TEMP}/c99-build" --output-on-failure

      - name: Check historical differential manifest (only actually promoted token observations)
        # Only original ROM-backed RAM records are promoted; never fabricate LIST or RUN oracles.
        run: |
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --image-cli "${RUNNER_TEMP}/c99-build/basic_program_image_cli" --ci

      - name: Verify sealed J0.27-B2 original twelve-session PRINT archive and negative tests
        run: |
          set -euo pipefail
          python3 tests/oracles/signed_print_evidence.py \
            --evidence tests/fixtures/cpc6128/signed_print \
            --permanent --self-test

      - name: Verify permanent C3/C4/C5 fixtures against original SHA provenance
        run: python3 tools/cpc_token_evidence.py --permanent --self-test

      - name: Verify permanent C6 independent RUN/probe evidence and source provenance
        run: python3 tests/oracles/cpc_run_evidence.py --evidence tests/fixtures/cpc6128/run_behavior --permanent --self-test

      - name: Verify C7 permanent authentic CPC LIST printer captures and forgery guards
        run: |
          set -euo pipefail
          python3 tests/oracles/cpc_list_evidence.py \
            --evidence tests/fixtures/cpc6128/list_printer --permanent --self-test

      - name: Check eight-case quantitative threshold (not J0.24 acceptance)
        run: |
          set -euo pipefail
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --ci --require-independent > "$RUNNER_TEMP/gate.log" 2>&1 && result=0 || result=$?
          cat "$RUNNER_TEMP/gate.log"
          if python3 -c 'import json; assert json.load(open("tests/fixtures/cpc6128/token_ram/manifest.json")).get("phase") == "J0.24-C5"'; then
            test "$result" -eq 0
            grep -q 'VERIFIED_CASES=8 TOKEN_BINARIES=8' "$RUNNER_TEMP/gate.log"
          else
            test "$result" -ne 0
            grep -q 'VERIFIED_CASES=5 TOKEN_BINARIES=5' "$RUNNER_TEMP/gate.log"
          fi

      - name: Acquire CPC 6128 BASIC 1.1 evidence
        run: |
          set -euo pipefail
          python3 tests/oracles/run_caprice32.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-oracle" \
            --case minimal --case witness

      - name: Acquire independent C6 RUN + post-RUN B% numeric probes (new CPC session per case)
        run: |
          set -euo pipefail
          python3 tests/oracles/run_behavior_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-run-behavior"

      - name: Check C6 raw channels, chronology, signed integers and negative mutations
        run: |
          set -euo pipefail
          python3 tests/oracles/cpc_run_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-run-behavior" --self-test
          python3 tools/cpc_token_evidence.py --permanent --self-test

      - name: Require C6 fresh behavioral acceptance (CPC/C99 C=5 D=2 MATCH_SEMANTIC)
        # Intentionally separate from structural validation: DIFF and other
        # outcomes must remain archived for diagnosis, but fail the job.
        run: |
          set -euo pipefail
          python3 tests/oracles/cpc_run_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-run-behavior" \
            --require-accepted-behavior

      - name: Reproduce C6 locally without GitHub Actions identity
        run: |
          set -euo pipefail
          env -u GITHUB_RUN_ID -u GITHUB_SHA \
            python3 tests/oracles/run_behavior_oracle.py \
              --caprice tests/oracles/caprice32 \
              --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
              --output "${RUNNER_TEMP}/cpc-run-behavior-local"
          python3 tests/oracles/cpc_run_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-run-behavior-local" \
            --self-test --require-accepted-behavior

      - name: Upload C6 RUN numeric proof (printer != screen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c6-run-behavior
          path: ${{ runner.temp }}/cpc-run-behavior/
          if-no-files-found: warn
          retention-days: 14

      - name: Acquire two C7 CPC LIST printer probes (fresh CPC per case, no RUN)
        run: |
          set -euo pipefail
          python3 tests/oracles/list_printer_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-list-printer"
          python3 tests/oracles/cpc_list_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-list-printer" --self-test

      - name: Log exact original C7 acquisition bytes for verified permanent promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          root = Path(os.environ["RUNNER_TEMP"]) / "cpc-list-printer"
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  print("C7_B64_BEGIN " + p.relative_to(root).as_posix(), flush=True)
                  b64 = base64.b64encode(p.read_bytes()).decode("ascii")
                  for offset in range(0, len(b64), 120):
                      print(b64[offset:offset + 120])
                  print("C7_B64_END", flush=True)
          PY

      - name: Upload C7 genuine CPC LIST printer and independent native stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c7-list-printer
          path: ${{ runner.temp }}/cpc-list-printer/
          if-no-files-found: warn
          retention-days: 30

      - name: Acquire C8 CPC 6128 LIST SCREEN without printer or RUN
        run: |
          set -euo pipefail
          python3 tests/oracles/list_screen_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-list-screen"
          python3 tests/oracles/cpc_screen_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-list-screen" --self-test

      - name: Export original C8 acquisition files unmodified for independent promotion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          root = Path(os.environ["RUNNER_TEMP"]) / "cpc-list-screen"
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  print("C8_B64_BEGIN " + p.relative_to(root).as_posix(), flush=True)
                  b64 = base64.b64encode(p.read_bytes()).decode("ascii")
                  for i in range(0, len(b64), 120):
                      print(b64[i:i+120], flush=True)
                  print("C8_B64_END", flush=True)
          PY

      - name: Reproduce C8 locally without Actions identity
        run: |
          set -euo pipefail
          env -u GITHUB_RUN_ID -u GITHUB_SHA \
            python3 tests/oracles/list_screen_oracle.py \
              --caprice tests/oracles/caprice32 \
              --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
              --output "${RUNNER_TEMP}/cpc-list-screen-local"
          python3 tests/oracles/cpc_screen_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-list-screen-local" --self-test

      - name: Upload C8 authentic CPC LIST screen pixels and separate C99 stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c8-list-screen
          path: ${{ runner.temp }}/cpc-list-screen/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify promoted C8 screen evidence when present
        run: |
          if test -f tests/fixtures/cpc6128/list_screen/manifest.json; then
            python3 tests/oracles/cpc_screen_evidence.py \
              --evidence tests/fixtures/cpc6128/list_screen --permanent --self-test
          else
            echo "C8 ORIGINAL SCREEN ACQUISITION PENDING PERMANENT PROMOTION"
          fi

      - name: Verify CPC token parser and archival helper syntax
        run: |
          python3 -m py_compile tools/promote_token_ram_c4.py tools/promote_token_ram_c5.py
          python3 tests/oracles/token_ram_oracle.py --self-test

      - name: Verify permanent J0.27-A provenance and negative forgery tests
        run: |
          set -euo pipefail
          python3 tests/oracles/numeric_print_evidence.py \
            --evidence tests/fixtures/cpc6128/numeric_print \
            --permanent --self-test

      - name: Acquire four independent J0.27-A CPC PRINT channels during RUN
        run: |
          set -euo pipefail
          python3 tests/oracles/numeric_print_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --output "$RUNNER_TEMP/j027-numeric-print"
          python3 tests/oracles/numeric_print_evidence.py \
            --evidence "$RUNNER_TEMP/j027-numeric-print" --self-test

      - name: Export unmodified J0.27-A acquisitions for independently reviewed archival
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          root = Path(os.environ["RUNNER_TEMP"]) / "j027-numeric-print"
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  print("J027_B64_BEGIN " + p.relative_to(root).as_posix(), flush=True)
                  data = base64.b64encode(p.read_bytes()).decode("ascii")
                  for i in range(0, len(data), 120):
                      print(data[i:i+120], flush=True)
                  print("J027_B64_END", flush=True)
          PY

      - name: Upload authentic J0.27-A CPC screen/printer/C99 captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-j027-numeric-print
          path: ${{ runner.temp }}/j027-numeric-print/
          if-no-files-found: warn
          retention-days: 30

      - name: Acquire six B1 signed INTEGER programs on CPC (12 fresh sessions)
        run: |
          set -euo pipefail
          python3 tests/oracles/signed_print_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --output "$RUNNER_TEMP/j027-b1-signed-print"
          python3 tests/oracles/signed_print_evidence.py \
            --evidence "$RUNNER_TEMP/j027-b1-signed-print" \
            --self-test --require-six-prints

      - name: Log all authentic B1 output bytes and SHA-256 for archival review
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "j027-b1-signed-print"
          for file in sorted(root.rglob("*")):
              if file.is_file():
                  path = file.relative_to(root).as_posix()
                  data = file.read_bytes()
                  print(f"B1_FILE {path} SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}", flush=True)
                  print("B1_B64_BEGIN " + path, flush=True)
                  encoded = base64.b64encode(data).decode("ascii")
                  for i in range(0, len(encoded), 120):
                      print(encoded[i:i + 120], flush=True)
                  print("B1_B64_END", flush=True)
          PY

      - name: Upload authentic B1 CPC screenshots, printer streams and native logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-j027-b1-signed-print
          path: ${{ runner.temp }}/j027-b1-signed-print/
          if-no-files-found: warn
          retention-days: 30

      - name: Acquire CPC BASIC token RAM images before RUN
        run: |
          set -euo pipefail
          python3 tests/oracles/token_ram_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "${RUNNER_TEMP}/c99-build/basic_program_image_cli" \
            --output "${RUNNER_TEMP}/cpc-token-oracle"

      - name: Validate every exported token byte and comparison classification
        run: |
          set -euo pipefail
          python3 tools/cpc_token_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-token-oracle" --self-test

      - name: Upload only delimited BASIC images and their provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-basic-token-ram-evidence
          path: ${{ runner.temp }}/cpc-token-oracle/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload independent oracle evidence (never ROMs or full snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-caprice32-evidence
          path: ${{ runner.temp }}/cpc-oracle/
          if-no-files-found: warn
          retention-days: 14
