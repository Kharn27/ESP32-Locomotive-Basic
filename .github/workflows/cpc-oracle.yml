name: CPC 6128 independent oracle

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "tests/oracles/**"
      - ".github/workflows/cpc-oracle.yml"
      - "tools/cpc_token_evidence.py"
      - "tests/fixtures/cpc6128/**"
      - "docs/J0.24-C3-cpc-token-memory.md"
      - "docs/J0.24-C4-extended-token-oracle.md"
      - "docs/J0.24-C5-eight-case-oracle.md"
      - "docs/J0.24-C6-run-behavior-oracle.md"
      - "tools/promote_token_ram_c5.py"
      - "tools/promote_token_ram_c4.py"
      - "docs/J0.24-C1-caprice32-oracle-automation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caprice32-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout pinned emulator submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Verify pinned Caprice32 revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          git ls-tree HEAD tests/oracles/caprice32
          test "$(git ls-tree HEAD tests/oracles/caprice32 | awk '{print $1}')" = "160000"

      - name: Install upstream Linux build dependencies and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev xvfb xauth python3

      - name: Build Caprice32 from pinned source
        working-directory: tests/oracles/caprice32
        run: |
          set -euo pipefail
          make -j 2 WITHOUT_GL=1 APP_PATH="$PWD"
          ./cap32 --version
          test -s rom/cpc6128.rom
          sha256sum rom/cpc6128.rom
          test -s rom/amsdos.rom
          sha256sum rom/amsdos.rom

      - name: Build portable C99 comparator
        run: |
          set -euo pipefail
          cmake -S . -B "${RUNNER_TEMP}/c99-build"
          cmake --build "${RUNNER_TEMP}/c99-build" -j 2
          ctest --test-dir "${RUNNER_TEMP}/c99-build" --output-on-failure

      - name: Check historical differential manifest (only actually promoted token observations)
        # Only original ROM-backed RAM records are promoted; never fabricate LIST or RUN oracles.
        run: |
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --image-cli "${RUNNER_TEMP}/c99-build/basic_program_image_cli" --ci

      - name: Verify permanent C3/C4/C5 fixtures against original SHA provenance
        run: python3 tools/cpc_token_evidence.py --permanent --self-test

      - name: Verify permanent C6 independent RUN/probe evidence and source provenance
        run: python3 tests/oracles/cpc_run_evidence.py --evidence tests/fixtures/cpc6128/run_behavior --permanent --self-test

      - name: Check eight-case quantitative threshold (not J0.24 acceptance)
        run: |
          set -euo pipefail
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --ci --require-independent > "$RUNNER_TEMP/gate.log" 2>&1 && result=0 || result=$?
          cat "$RUNNER_TEMP/gate.log"
          if python3 -c 'import json; assert json.load(open("tests/fixtures/cpc6128/token_ram/manifest.json")).get("phase") == "J0.24-C5"'; then
            test "$result" -eq 0
            grep -q 'VERIFIED_CASES=8 TOKEN_BINARIES=8' "$RUNNER_TEMP/gate.log"
          else
            test "$result" -ne 0
            grep -q 'VERIFIED_CASES=5 TOKEN_BINARIES=5' "$RUNNER_TEMP/gate.log"
          fi

      - name: Acquire CPC 6128 BASIC 1.1 evidence
        run: |
          set -euo pipefail
          python3 tests/oracles/run_caprice32.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-oracle" \
            --case minimal --case witness

      - name: Acquire independent C6 RUN + post-RUN B% numeric probes (new CPC session per case)
        run: |
          set -euo pipefail
          python3 tests/oracles/run_behavior_oracle.py \
            --caprice tests/oracles/caprice32 \
            --native-cli "${RUNNER_TEMP}/c99-build/loco_basic_cli" \
            --output "${RUNNER_TEMP}/cpc-run-behavior"

      - name: Check C6 raw channels, chronology, signed integers and negative mutations
        run: |
          set -euo pipefail
          python3 tests/oracles/cpc_run_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-run-behavior" --self-test
          python3 tools/cpc_token_evidence.py --permanent --self-test

      - name: Upload C6 RUN numeric proof (printer != screen)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c6-run-behavior
          path: ${{ runner.temp }}/cpc-run-behavior/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify CPC token parser and archival helper syntax
        run: |
          python3 -m py_compile tools/promote_token_ram_c4.py tools/promote_token_ram_c5.py
          python3 tests/oracles/token_ram_oracle.py --self-test

      - name: Acquire CPC BASIC token RAM images before RUN
        run: |
          set -euo pipefail
          python3 tests/oracles/token_ram_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "${RUNNER_TEMP}/c99-build/basic_program_image_cli" \
            --output "${RUNNER_TEMP}/cpc-token-oracle"

      - name: Validate every exported token byte and comparison classification
        run: |
          set -euo pipefail
          python3 tools/cpc_token_evidence.py \
            --evidence "${RUNNER_TEMP}/cpc-token-oracle" --self-test

      - name: Upload only delimited BASIC images and their provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-basic-token-ram-evidence
          path: ${{ runner.temp }}/cpc-token-oracle/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload independent oracle evidence (never ROMs or full snapshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-caprice32-evidence
          path: ${{ runner.temp }}/cpc-oracle/
          if-no-files-found: warn
          retention-days: 14
