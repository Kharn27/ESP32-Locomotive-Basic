name: HW3 CYD CPC boot display (Xtensa)

on:
  pull_request:
    paths:
      - 'firmware/esp32_display_probe/**'
      - 'docs/HW3-cpc-display-spike.md'
      - '.github/workflows/hw3-display.yml'
  workflow_dispatch:

jobs:
  hw3-target-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - name: ESP-IDF 5.5.6 native Xtensa target verification
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project \
            espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              cd firmware/esp32_display_probe
              mkdir -p reports
              idf.py --version | tee reports/idf-version.txt
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              xtensa-esp-elf-gcc --version | head -n 1 | tee reports/compiler-version.txt
              xtensa-esp-elf-gcc -dumpmachine | tee reports/compiler-target.txt
              grep -Fx "xtensa-esp-elf" reports/compiler-target.txt
              idf.py set-target esp32 2>&1 | tee reports/set-target.log
              idf.py build 2>&1 | tee reports/build.log
              idf.py size 2>&1 | tee reports/size.txt
              idf.py size-components 2>&1 | tee reports/size-components.txt
              xtensa-esp-elf-readelf -h build/loco_esp32_display_probe.elf | tee reports/elf-header.txt
              grep -q "Tensilica Xtensa" reports/elf-header.txt
              ls -lh build/loco_esp32_display_probe.bin build/loco_esp32_display_probe.elf | tee reports/binary-sizes.txt
              cp sdkconfig reports/sdkconfig.effective
              printf "TARGET_BUILD_VERIFIED / ON_DEVICE_UNVERIFIED\n" | tee reports/status.txt
            '
      - name: Preserve build proof and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: hw3-xtensa-display-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            firmware/esp32_display_probe/reports/
            firmware/esp32_display_probe/build/loco_esp32_display_probe.bin
            firmware/esp32_display_probe/build/loco_esp32_display_probe.elf
            firmware/esp32_display_probe/build/loco_esp32_display_probe.map
            firmware/esp32_display_probe/sdkconfig
