name: HW4-B shared ILI9341 driver
on:
  pull_request:
    paths:
      - 'firmware/components/cyd_ili9341/**'
      - 'firmware/esp32_display_probe/**'
      - 'firmware/esp32_probe/**'
      - '.github/workflows/hw4-b-shared-driver.yml'
  workflow_dispatch:
jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Exactly one SPI/LCD transport source, no changes to portable code
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main firmware/esp32_probe/main --include='*.c'
          base="$(git merge-base origin/main HEAD)"
          if test "$GITHUB_HEAD_REF" = "feat/hw4-c3-a-cpc-boot-console"; then
            # C3-A adds only two boot-video files and four display-probe files.
            # Preserve core, fixture, transport and non-boot video immutability.
            bash tools/hw4_c3_a_scope_gate.sh "$base" HEAD
          else
            git diff --exit-code "$base" HEAD -- core/ video/ tests/fixtures/
          fi
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Strict C99 tests, sanitizer coverage and PPM
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBP_SANITIZERS=${{ matrix.sanitize }}
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Both ESP-IDF 5.5.6 Xtensa images and memory reports
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project -e IDF_GIT_SAFE_DIR=/project espressif/idf:v5.5.6 bash -lc '
            set -euo pipefail
            for app in esp32_display_probe esp32_probe; do
              cd /project/firmware/"$app"
              mkdir -p reports
              idf.py --version | tee reports/idf-version.txt
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              idf.py set-target esp32 2>&1 | tee reports/set-target.log
              idf.py build 2>&1 | tee reports/build.log
              idf.py size 2>&1 | tee reports/size.txt
              idf.py size-components 2>&1 | tee reports/size-components.txt
              ls -lh build/*.bin build/*.elf | tee reports/images.txt
            done'
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-b-target-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_display_probe/reports/
            firmware/esp32_probe/reports/
