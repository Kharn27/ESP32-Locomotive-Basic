name: HW4-C1 integrated BASIC TFT
on:
  pull_request:
    paths:
      - 'firmware/esp32_display_probe/**'
      - 'firmware/esp32_loco/**'
      - 'video/cpc_text.*'
      - 'tests/test_cpc_text.c'
      - 'tests/test_hw4_c1_integration.c'
      - 'CMakeLists.txt'
      # Revalidate the already-integrated BASIC-to-TFT bridge for core changes.
      - 'core/**'
      - '.github/workflows/hw4-c1-integrated.yml'
  workflow_dispatch:

jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Preserve shared LCD transport, CPC fixtures and core
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main --include='*.c'
          base="$(git merge-base origin/main HEAD)"
          # Always protect CPC archives and the shared display transport.
          # An oracle-only J1.10-A PR may ADD only its own captured files.
          # No past archive, shared video/driver, firmware or HW4 file changes.
          if test "$GITHUB_HEAD_REF" = "oracle/j1-10-a-if-then-integer"; then
            git diff --name-only "$base" HEAD -- tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/ > "$RUNNER_TEMP/hw4-j110-diff.txt"
            if grep -Ev '^(tests/fixtures/cpc6128/j1_10_if_then/|tests/oracles/inputs/j1_10_a/|tests/oracles/j1_10_if_then_oracle.py$)' "$RUNNER_TEMP/hw4-j110-diff.txt"; then
              echo "FORBIDDEN OLD_ORACLE_OR_HW4_MODIFICATION"
              exit 1
            fi
            python3 tools/j1_10_if_then_verify.py --permanent --self-test
          elif test "$GITHUB_HEAD_REF" = "oracle/j1-11-a-gosub-return"; then
            # J1.11-A may ADD only its dedicated ROM oracle; all earlier
            # fixtures, sources and HW4 transport must remain byte-identical.
            git diff --name-only "$base" HEAD -- tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/ > "$RUNNER_TEMP/hw4-j111-diff.txt"
            if grep -Ev '^(tests/fixtures/cpc6128/j1_11_gosub_return/|tests/oracles/inputs/j1_11_a/|tests/oracles/j1_11_gosub_return_oracle.py$)' "$RUNNER_TEMP/hw4-j111-diff.txt"; then
              echo "J1.11-A OLD_ORACLE_OR_HW4_MODIFICATION_FORBIDDEN"
              exit 1
            fi
            python3 tools/j1_11_gosub_return_verify.py --permanent --self-test
          else
            git diff --exit-code "$base" HEAD -- tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/
          fi
          # The historical HW4-C1 no-core-change rule only applies when the
          # PR actually changes HW4-C1 product files. A parallel J1 core PR
          # must not fail the HW4-C1 integration check merely for touching core/.
          if git diff --name-only "$base" HEAD -- video/cpc_text.c video/cpc_text.h tests/test_cpc_text.c tests/test_hw4_c1_integration.c | grep -q .; then
            git diff --exit-code "$base" HEAD -- core/
          fi
          test "$(grep -c '^void app_main(void)' firmware/esp32_display_probe/main/hw4_c2_console.c)" -eq 1
          test ! -e firmware/esp32_loco/CMakeLists.txt
          ! grep -R 'esp_lcd_new_panel_ili9341' firmware/esp32_display_probe/main/

  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF', 'ON']
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Strict C99 + all existing suites + HW4-C1
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBP_SANITIZERS=${{ matrix.sanitizers }}
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-${{ matrix.sanitizers }}.txt
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c1-linux-${{ matrix.sanitizers }}
          if-no-files-found: warn
          retention-days: 30
          path: ctest-${{ matrix.sanitizers }}.txt

  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Xtensa 5.5.6 image with BASIC TFT, independent J0.25 probe
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              for app in esp32_display_probe esp32_probe; do
                cd /project/firmware/"$app"
                mkdir -p reports
                idf.py --version | tee reports/idf-version.txt
                idf.py --version | grep -Fx "ESP-IDF v5.5.6"
                idf.py set-target esp32 2>&1 | tee reports/set-target.log
                idf.py build 2>&1 | tee reports/build.log
                idf.py size 2>&1 | tee reports/size.txt
                idf.py size-components 2>&1 | tee reports/size-components.txt
                ls -lh build/*.bin build/*.elf | tee reports/images.txt
              done
            '
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c1-three-targets
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_display_probe/reports/
            firmware/esp32_probe/reports/
            firmware/esp32_display_probe/build/loco_esp32_display_probe.bin
            firmware/esp32_display_probe/build/loco_esp32_display_probe.elf
