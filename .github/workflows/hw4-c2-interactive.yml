name: HW4-C2 UART interactive BASIC
on:
  pull_request:
    paths:
      - 'io/uart_line.*'
      - 'video/cpc_uart_console.*'
      - 'tests/test_uart_line.c'
      - 'tests/test_cpc_uart_console.c'
      - 'tests/test_hw4_c2_integration.c'
      - 'firmware/esp32_display_probe/**'
      - 'CMakeLists.txt'
      - '.github/workflows/hw4-c2-interactive.yml'
  workflow_dispatch:
jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: One owner, immutable core/fixtures and driver, no second LCD
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main/hw4_c2_console.c
          git diff --exit-code "$(git merge-base origin/main HEAD)" HEAD -- core/ tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/
          test "$(grep -c '^void app_main(void)' firmware/esp32_display_probe/main/hw4_c2_console.c)" -eq 1
          ! grep -R 'esp_lcd_new_panel_ili9341' firmware/esp32_display_probe/main/
          ! grep -R -E 'malloc[()]|calloc[()]|realloc[()]|free[()]' io/uart_line.c video/cpc_uart_console.c firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_submit(' firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_step(' firmware/esp32_display_probe/main/hw4_c2_console.c
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF','ON']
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Strict C99 all suites including 3 HW4-C2 cases
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBP_SANITIZERS=${{ matrix.sanitizers }}
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-hw4-c2-${{ matrix.sanitizers }}.txt
          ctest --test-dir build -N | grep 'Total Tests: 53'
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c2-linux-${{ matrix.sanitizers }}
          if-no-files-found: warn
          retention-days: 30
          path: ctest-hw4-c2-${{ matrix.sanitizers }}.txt
  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Existing display probe with interactive BASIC; BASIC probe; legacy C1 firmware
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              for app in esp32_display_probe esp32_probe esp32_loco; do
                cd /project/firmware/"$app"
                mkdir -p reports
                idf.py --version | tee reports/idf-version.txt
                idf.py --version | grep -Fx "ESP-IDF v5.5.6"
                idf.py set-target esp32 2>&1 | tee reports/set-target.log
                idf.py build 2>&1 | tee reports/build.log
                idf.py size 2>&1 | tee reports/size.txt
                idf.py size-components 2>&1 | tee reports/size-components.txt
                ls -lh build/*.bin build/*.elf | tee reports/images.txt
              done
            '
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c2-three-targets
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_display_probe/reports/
            firmware/esp32_probe/reports/
            firmware/esp32_loco/reports/
            firmware/esp32_display_probe/build/loco_esp32_display_probe.bin
            firmware/esp32_display_probe/build/loco_esp32_display_probe.elf
