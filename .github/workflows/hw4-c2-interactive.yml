name: HW4-C2 UART interactive BASIC
on:
  pull_request:
    paths:
      - 'io/uart_line.*'
      - 'io/cpc_uart_console.*'
      - 'tests/test_uart_line.c'
      - 'tests/test_cpc_uart_console.c'
      - 'tests/test_hw4_c2_integration.c'
      - 'firmware/esp32_display_probe/**'
      - 'firmware/esp32_loco/**'
      - 'CMakeLists.txt'
      - '.github/workflows/hw4-c2-interactive.yml'
  workflow_dispatch:
jobs:
  architecture:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: One owner, immutable core/fixtures and driver, no second LCD
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main/hw4_c2_console.c
          base="$(git merge-base origin/main HEAD)"
          # An oracle-only J1.10-A PR may ADD only its own captured files.
          # No past archive, shared video/driver, firmware or HW4 file changes.
          if test "$GITHUB_HEAD_REF" = "oracle/j1-10-a-if-then-integer"; then
            git diff --name-only "$base" HEAD -- tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/ > "$RUNNER_TEMP/hw4-j110-diff.txt"
            if grep -Ev '^(tests/fixtures/cpc6128/j1_10_if_then/|tests/oracles/inputs/j1_10_a/|tests/oracles/j1_10_if_then_oracle.py$)' "$RUNNER_TEMP/hw4-j110-diff.txt"; then
              echo "FORBIDDEN OLD_ORACLE_OR_HW4_MODIFICATION"
              exit 1
            fi
            python3 tools/j1_10_if_then_verify.py --permanent --self-test
          else
            git diff --exit-code "$base" HEAD -- tests/fixtures/ tests/oracles/ video/cpc_video.c video/cpc_palette.c firmware/components/cyd_ili9341/
          fi
          # HW4 product changes still forbid core/ changes. A parallel J1
          # core-only PR must instead preserve ALL HW4 firmware and IO files.
          if git diff --name-only "$base" HEAD -- io/uart_line.c io/cpc_uart_console.c firmware/esp32_display_probe/ tests/test_uart_line.c tests/test_cpc_uart_console.c tests/test_hw4_c2_integration.c | grep -q .; then
            git diff --exit-code "$base" HEAD -- core/
          else
            git diff --exit-code "$base" HEAD -- firmware/ io/
          fi
          test "$(grep -c '^void app_main(void)' firmware/esp32_display_probe/main/hw4_c2_console.c)" -eq 1
          ! grep -R 'esp_lcd_new_panel_ili9341' firmware/esp32_display_probe/main/
          ! grep -R -E 'malloc[()]|calloc[()]|realloc[()]|free[()]' io/uart_line.c io/cpc_uart_console.c firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_submit(' firmware/esp32_display_probe/main/hw4_c2_console.c
          grep -F 'bsr_step(' firmware/esp32_display_probe/main/hw4_c2_console.c
          test ! -e firmware/esp32_loco/CMakeLists.txt
          # Portability: ANSI decoder/echo shared by input and TFT, no leaks.
          grep -F 'UART_ANSI_CSI' io/uart_line.c
          grep -F 'cpc_uart_console_backspace' firmware/esp32_display_probe/main/hw4_c2_console.c
  linux:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ['OFF','ON']
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Strict C99 all suites including 3 HW4-C2 cases
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DBP_SANITIZERS=${{ matrix.sanitizers }}
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure 2>&1 | tee ctest-hw4-c2-${{ matrix.sanitizers }}.txt
          # HW4-C2 baseline had 55 CTest suites; later J1 native PRs
          # add suites and must not fail because this count increases.
          count="$(ctest --test-dir build -N | awk '/Total Tests:/ {print $3}')"
          test "$count" -ge 55
          # Includes the immutable J1.10-A oracle plus HW4-C3-A boot test.
          if test "$GITHUB_HEAD_REF" = feat/hw4-c3-a-cpc-boot-console; then
            test "$count" -ge 59
            ctest --test-dir build -N | grep -F 'hw4_c3_boot_screen'
            ctest --test-dir build -N | grep -F 'j1_10_a_if_then_cpc_permanent'
          fi
          echo "HW4-C2 BASELINE_MINIMUM=55 ACTUAL=$count"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c2-linux-${{ matrix.sanitizers }}
          if-no-files-found: warn
          retention-days: 30
          path: ctest-hw4-c2-${{ matrix.sanitizers }}.txt
  targets:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Real Xtensa 5.5.6 - console ON, historical HW3 OFF, BASIC probe
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              cd /project/firmware/esp32_display_probe
              mkdir -p reports/c2-on reports/hw3-off
              idf.py --version | tee reports/idf-version.txt
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              # Two *independent* build directories, same source project.
              idf.py -B build-c2 -DHW4_C2_CONSOLE=ON set-target esp32 2>&1 | tee reports/c2-on/set-target.log
              idf.py -B build-c2 -DHW4_C2_CONSOLE=ON build 2>&1 | tee reports/c2-on/build.log
              idf.py -B build-c2 size 2>&1 | tee reports/c2-on/size.txt
              idf.py -B build-c2 size-components 2>&1 | tee reports/c2-on/size-components.txt
              test "$(xtensa-esp-elf-nm --defined-only build-c2/loco_esp32_display_probe.elf | grep -Ec " [TW] app_main$")" -eq 1
              echo "CONSOLE_ON_ONE_APP_MAIN=PASS" | tee reports/c2-on/app-main.txt
              idf.py -B build-hw3 -DHW4_C2_CONSOLE=OFF set-target esp32 2>&1 | tee reports/hw3-off/set-target.log
              idf.py -B build-hw3 -DHW4_C2_CONSOLE=OFF build 2>&1 | tee reports/hw3-off/build.log
              idf.py -B build-hw3 size 2>&1 | tee reports/hw3-off/size.txt
              idf.py -B build-hw3 size-components 2>&1 | tee reports/hw3-off/size-components.txt
              test "$(xtensa-esp-elf-nm --defined-only build-hw3/loco_esp32_display_probe.elf | grep -Ec " [TW] app_main$")" -eq 1
              echo "HISTORIC_HW3_OFF_ONE_APP_MAIN=PASS" | tee reports/hw3-off/app-main.txt
              # Independent J0.25 BASIC probe, unaffected by HW4.
              cd /project/firmware/esp32_probe
              mkdir -p reports
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              idf.py set-target esp32 2>&1 | tee reports/set-target.log
              idf.py build 2>&1 | tee reports/build.log
              idf.py size 2>&1 | tee reports/size.txt
              idf.py size-components 2>&1 | tee reports/size-components.txt
            '
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-c2-on-off-basic-targets
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_display_probe/reports/
            firmware/esp32_probe/reports/
            firmware/esp32_display_probe/build-c2/loco_esp32_display_probe.bin
            firmware/esp32_display_probe/build-hw3/loco_esp32_display_probe.bin
