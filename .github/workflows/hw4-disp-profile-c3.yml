name: HW4-DISP-PROFILE-C3 SPI40/20 build-time variant verification
on:
  pull_request:
    paths:
      - 'firmware/components/cyd_ili9341/**'
      - 'firmware/esp32_display_probe/**'
      - 'video/hw4_disp_profile.*'
      - 'tools/ci/hw4_disp_spi_*.py'
      - 'docs/HW4-MEM-C7.md'
      - 'tests/test_hw4_mem_c7.py'
      - 'tools/ci/hw4_mem_c7_build.sh'
      - 'tools/ci/hw4_mem_c7_*.py'
      - '.github/workflows/hw4-disp-profile-c3.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing OPEN GitHub PR number'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  clock-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Positive and negative build-time frequency selector tests
        run: |
          set -euo pipefail
          python3 tools/ci/hw4_disp_spi_policy.py

  two-variants-xtensa:
    needs: clock-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      C7_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      C7_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      C7_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      C7_MODE: c3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: C7 adversarial memory and identity tests
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci/hw4_mem_c7_*.py
          bash -n tools/ci/hw4_mem_c7_build.sh
          python3 -m unittest discover -s tests -p 'test_hw4_mem_c7.py' -v
      - name: Five real Xtensa builds, historical failure rc=1, dual SPI incremental gate
        run: |
          set -euo pipefail
          bash tools/ci/hw4_mem_c7_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw4-disp-c3-c7-real-spi40-spi20
          retention-days: 30
          if-no-files-found: warn
          path: reports/hw4-mem-c7/
