name: HW4-DISP-RENDER-A exact RGB565, CPU baseline and Xtensa budget
on:
  pull_request:
    paths:
      - 'video/cpc_video.c'
      - 'CMakeLists.txt'
      - 'tests/*hw4_render_a*'
      - 'tools/ci/hw4_render_a_memory.py'
      - 'docs/HW4-MEM-C7.md'
      - 'tests/test_hw4_mem_c7.py'
      - 'tools/ci/hw4_mem_c7_build.sh'
      - 'tools/ci/hw4_mem_c7_*.py'
      - 'docs/HW4-DISP-RENDER-A.md'
      - '.github/workflows/hw4-disp-render-a.yml'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing OPEN GitHub PR number'
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  host-differential-and-benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile GCC and Clang -O3, compare frozen baseline and measure
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p reports/hw4-render-a
          for cc in gcc clang; do
            cmake -S . -B "build-hw4-render-$cc" \
              -DCMAKE_C_COMPILER="$cc" -DCMAKE_C_FLAGS="-O3 -fno-lto" \
              -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON \
              > "reports/hw4-render-a/configure-$cc.log" 2>&1
            cmake --build "build-hw4-render-$cc" --parallel 2 \
              --target test_hw4_render_a bench_hw4_render_a \
              > "reports/hw4-render-a/build-$cc.log" 2>&1 || {
                tail -100 "reports/hw4-render-a/build-$cc.log"; exit 1;
              }
            ctest --test-dir "build-hw4-render-$cc" --output-on-failure \
              -R '^hw4_disp_render_a_rgb565_exact$' \
              | tee "reports/hw4-render-a/differential-$cc.log"
            "./build-hw4-render-$cc/bench_hw4_render_a" \
              | tee "reports/hw4-render-a/benchmark-$cc.log"
            {
              echo "### HW4-DISP-RENDER-A $cc -O3 HOST"
              echo '~~~text'
              cat "reports/hw4-render-a/benchmark-$cc.log"
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw4-render-a-host-benchmarks
          retention-days: 30
          if-no-files-found: warn
          path: reports/hw4-render-a/

  xtensa-memory-baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      C7_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      C7_WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      C7_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      C7_MODE: render
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: C7 adversarial regression and provenance tests
        run: |
          set -euo pipefail
          python3 -m compileall -q tools/ci/hw4_mem_c7_*.py
          bash -n tools/ci/hw4_mem_c7_build.sh
          python3 -m unittest discover -s tests -p 'test_hw4_mem_c7.py' -v
      - name: Five real Xtensa builds, historical failure rc=1, real incremental gate
        run: |
          set -euo pipefail
          bash tools/ci/hw4_mem_c7_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hw4-render-a-c7-real-elf-history-incremental
          retention-days: 30
          if-no-files-found: warn
          path: reports/hw4-mem-c7/
