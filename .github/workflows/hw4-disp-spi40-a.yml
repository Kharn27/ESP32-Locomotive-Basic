name: HW4-DISP-SPI40-A CONSOLE dual-build clock qualification
on:
  pull_request:
    paths:
      - "firmware/**"
      - "tools/ci/hw4_spi40_policy.py"
      - "docs/HW4-DISP-SPI40-A.md"
      - ".github/workflows/hw4-disp-spi40-a.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Real CMake positive/negative config and HAL invariant checks
        run: python3 tools/ci/hw4_spi40_policy.py

  console-variants:
    needs: host-policy
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: SPI20
            hz: "20000000"
          - label: SPI40
            hz: "40000000"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: ESP-IDF v5.5.6 exact HEAD / independent CONSOLE variant
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LCD_SPI_HZ: ${{ matrix.hz }}
          VARIANT: ${{ matrix.label }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project \
            -e EXPECTED_HEAD="$EXPECTED_HEAD" \
            -e LCD_SPI_HZ="$LCD_SPI_HZ" -e VARIANT="$VARIANT" \
            espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              idf.py --version | grep -Fx "ESP-IDF v5.5.6"
              cd firmware/esp32_display_probe
              build="build-hw4-spi40-$VARIANT"
              cfg="$PWD/sdkconfig.hw4-spi40-$VARIANT"
              out="$PWD/reports/hw4-spi40-$VARIANT"
              mkdir -p "$out"
              idf.py -B "$build" -DSDKCONFIG="$cfg" \
                -DLOCO_CYD_PROFILE=CONSOLE \
                -DCYD_LCD_SPI_HZ="$LCD_SPI_HZ" set-target esp32 > "$out/configure.txt" 2>&1
              idf.py -B "$build" -DSDKCONFIG="$cfg" \
                -DLOCO_CYD_PROFILE=CONSOLE \
                -DCYD_LCD_SPI_HZ="$LCD_SPI_HZ" build > "$out/build.txt" 2>&1 || {
                  tail -n 120 "$out/build.txt"; exit 1;
                }
              grep -Fx "CYD_LCD_SPI_HZ:STRING=$LCD_SPI_HZ" "$build/CMakeCache.txt"
              grep -Fx "LOCO_CYD_PROFILE:STRING=CONSOLE" "$build/CMakeCache.txt"
              grep -F "LCD_CLOCK_HZ=${LCD_SPI_HZ}U" "$build/compile_commands.json" > "$out/compile-flag.txt"
              grep -Fx "CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ=160" "$cfg"
              python3 /project/tools/ci/verify_esp_app_version.py \
                "$build/loco_esp32_display_probe.bin" "$EXPECTED_HEAD" loco_esp32_display_probe
              idf.py -B "$build" size > "$out/size.txt"
              xtensa-esp-elf-size -A "$build/loco_esp32_display_probe.elf" > "$out/sections.txt"
              xtensa-esp-elf-nm -S --defined-only "$build/loco_esp32_display_probe.elf" > "$out/symbols.txt"
              python3 /project/tools/ci/check_u1b_memory.py CONSOLE "$out/size.txt" \
                --nm-file "$out/symbols.txt" \
                --console-source /project/firmware/esp32_display_probe/main/hw4_c2_console.c \
                --contract /project/firmware/esp32_display_probe/main/j1_15_c_string_arena.h \
                > "$out/memory.txt"
              sha256sum "$build/loco_esp32_display_probe.bin" > "$out/bin-sha256.txt"
              printf "HEAD=%s\nPROFILE=CONSOLE\nVARIANT=%s\nREQUESTED_SPI_HZ=%s\nEFFECTIVE_SPI_HZ=UNMEASURED\n" \
                 "$EXPECTED_HEAD" "$VARIANT" "$LCD_SPI_HZ" > "$out/manifest.txt"
              echo "HW4-SPI40 VARIANT=$VARIANT requested_spi_hz=$LCD_SPI_HZ BUILD=PASS sha=$EXPECTED_HEAD"
            '
      - name: Publish build provenance and sizes
        run: |
          cat "firmware/esp32_display_probe/reports/hw4-spi40-${{ matrix.label }}/manifest.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "firmware/esp32_display_probe/reports/hw4-spi40-${{ matrix.label }}/bin-sha256.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: hw4-spi40-${{ matrix.label }}-exact-head
          retention-days: 30
          path: |
            firmware/esp32_display_probe/reports/hw4-spi40-${{ matrix.label }}/
            firmware/esp32_display_probe/build-hw4-spi40-${{ matrix.label }}/loco_esp32_display_probe.bin
            firmware/esp32_display_probe/build-hw4-spi40-${{ matrix.label }}/loco_esp32_display_probe.elf
