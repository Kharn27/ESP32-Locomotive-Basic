name: J0.24-C5 one-shot import
on:
  push:
    branches:
      - feat/j0-24-c5-eight-case-oracle
  workflow_dispatch:

# TEMPORARY one-shot acquisition only: self-removes before committing.
permissions:
  contents: write

jobs:
  acquire-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact C5 HEAD and pinned emulator submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - name: Verify emulator pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(git ls-tree HEAD tests/oracles/caprice32 | awk '{print $1}')" = 160000
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev xvfb xauth python3
      - name: Build pinned Caprice32
        working-directory: tests/oracles/caprice32
        run: |
          set -euo pipefail
          make -j 2 WITHOUT_GL=1 APP_PATH="$PWD"
          ./cap32 --version
          test "$(sha256sum rom/cpc6128.rom | awk '{print $1}')" = "31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562"
      - name: Build and test portable core
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/c99-build" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/c99-build" -j 2
          ctest --test-dir "$RUNNER_TEMP/c99-build" --output-on-failure
      - name: Acquire eight independent token RAM images
        run: |
          set -euo pipefail
          python3 tests/oracles/token_ram_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --output "$RUNNER_TEMP/cpc-token-oracle"
          python3 tools/cpc_token_evidence.py --evidence "$RUNNER_TEMP/cpc-token-oracle" --self-test
      - name: Upload original CPC run evidence BEFORE promotion
        id: original
        uses: actions/upload-artifact@v4
        with:
          name: cpc6128-c5-original-evidence
          path: ${{ runner.temp }}/cpc-token-oracle/
          if-no-files-found: error
          retention-days: 14
      - name: Promote only new authentic CPC images
        run: |
          set -euo pipefail
          python3 tools/promote_token_ram_c5.py \
            --evidence "$RUNNER_TEMP/cpc-token-oracle" \
            --run-id "${{ github.run_id }}" \
            --artifact-id "${{ steps.original.outputs.artifact-id }}" \
            --artifact-digest "sha256:${{ steps.original.outputs.artifact-digest }}"
          python3 tools/cpc_token_evidence.py --permanent --self-test
          python3 tools/cpc_diff.py \
            --manifest tests/fixtures/cpc6128/manifest.json \
            --cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --ci --require-independent
      - name: Remove temporary workflow and commit observed evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/j0-24-c5-import.yml
          git add -A -- .github/workflows/j0-24-c5-import.yml \
            tests/fixtures/cpc6128/token_ram/ \
            tests/fixtures/cpc6128/manifest.json \
            docs/J0.24-C5-eight-case-oracle.md \
            docs/PROJECT_STATUS.md
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -c '/program.bin$')" -eq 3
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "evidence(J0.24-C5): archive three independent CPC ROM token images"
          git push origin "HEAD:refs/heads/feat/j0-24-c5-eight-case-oracle"
