name: J0.27-B2 one-shot audited historical evidence import
# TEMPORARY import workflow. The successful import commit deletes this file.
# It only copies bytes downloaded from approved GitHub Actions artifact.
on:
  push:
    branches:
      - feat/j0-27-b2-permanent-signed-evidence
    paths:
      - ".github/workflows/j027-b2-import.yml"

permissions:
  contents: write

jobs:
  import-approved-b1:
    if: github.repository == 'Kharn27/ESP32-Locomotive-Basic'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout single target branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          submodules: false

      - name: Fetch precisely the approved original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" \
            /repos/Kharn27/ESP32-Locomotive-Basic/actions/artifacts/12668440819/zip \
            > "${RUNNER_TEMP}/approved-b1.zip"
          python3 -m zipfile -t "${RUNNER_TEMP}/approved-b1.zip"

      - name: Verify the original, import EVERY session without byte alteration, seal
        env:
          ARCHIVE_ZIP: ${{ runner.temp }}/approved-b1.zip
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import zipfile
          sys.path.insert(0, "tests/oracles")
          from signed_print_evidence import verify
          from signed_print_permanent import APPROVED_ORIGIN, promotion_manifest, verify_permanent

          archive = Path(os.environ["ARCHIVE_ZIP"])
          target = Path("tests/fixtures/cpc6128/signed_print")
          assert not target.exists(), "permanent archive already exists; fail closed"
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)), "duplicate ZIP names"
              assert "manifest.json" in names, "missing original manifest"
              raw = z.read("manifest.json")
              assert len(raw) == APPROVED_ORIGIN["acquisition_manifest_size_bytes"]
              assert hashlib.sha256(raw).hexdigest() == APPROVED_ORIGIN["acquisition_manifest_sha256"]
              m = json.loads(raw)
              assert m["github_run_id"] == str(APPROVED_ORIGIN["run_id"])
              assert m["github_sha"] == APPROVED_ORIGIN["github_sha"]
              assert len(m["captures"]) == 12
              inventory = {"manifest.json"}
              for cap in m["captures"]:
                  inventory.update(cap["id"] + "/" + name for name in cap["files"])
              assert set(names) == inventory, "artifact does not contain all and only B1 evidence"
              for info in z.infolist():
                  name = PurePosixPath(info.filename)
                  assert not name.is_absolute() and ".." not in name.parts
                  assert not info.is_dir()
                  assert stat.S_IFMT(info.external_attr >> 16) != stat.S_IFLNK
                  data = z.read(info.filename)
                  out = target / info.filename
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
          # Run the historical validator on untouched acquisition directory.
          verify(target, require_six_prints=True)
          assert (target / "manifest.json").read_bytes() == raw
          (target / "manifest.json").rename(target / "acquisition.json")
          (target / "manifest.json").write_text(
              json.dumps(promotion_manifest(), indent=2) + "\n", encoding="utf-8")
          verify_permanent(target)
          print("IMPORTED", len(names), "original ZIP entries; sealed archive ready")
          PY
          python3 tests/oracles/signed_print_evidence.py \
            --evidence tests/fixtures/cpc6128/signed_print --permanent --self-test

      - name: Commit original bytes and remove this temporary import workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/cpc6128/signed_print
          git rm -f .github/workflows/j027-b2-import.yml
          git diff --cached --check
          git commit -m "J0.27-B2: archive approved B1 bytes and retire one-shot importer"
          git push origin HEAD:feat/j0-27-b2-permanent-signed-evidence
