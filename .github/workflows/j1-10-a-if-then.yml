name: J1.10-A CPC6128 independent IF THEN oracle

on:
  pull_request:
    paths:
      - '.github/workflows/j1-10-a-if-then.yml'
      - 'tools/j1_10_if_then_verify.py'
      - 'tests/oracles/j1_10_if_then_oracle.py'
      - 'tests/oracles/inputs/j1_10_a/**'
      - 'tests/fixtures/cpc6128/j1_10_if_then/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: j110-if-then-cpc-${{ github.head_ref || github.ref }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  original-cpc-acquisition:
    if: github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-10-a-if-then-integer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Verify true checkout, pinned ROM and immutable code/HW4 boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -s tests/oracles/caprice32/rom/amsdos.rom
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee "$RUNNER_TEMP/j110-files.txt"
          if grep -E '^(core/|firmware/|video/|hal/|io/|tests/oracles/caprice32|tests/fixtures/cpc6128/)' "$RUNNER_TEMP/j110-files.txt" | grep -v '^tests/fixtures/cpc6128/j1_10_if_then/'; then
            echo "J1.10-A CORE_HW4_OLD_ARCHIVES_FORBIDDEN"
            exit 1
          fi
          echo "J1.10-A ORACLE_CHECKOUT_PINNED GHCR_APT_NONE CAPRICE_BUILD_NONE HEAD=$GITHUB_HEAD_SHA"
      - name: Compile unchanged native CLI and execute existing C99 suite
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/j110-c99" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/j110-c99" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/j110-c99" --output-on-failure
          python3 tools/j1_9_binary_family_verify.py --permanent --self-test
          python3 tools/j1_9_b_native_verify.py --cli "$RUNNER_TEMP/j110-c99/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/j110-c99/basic_program_image_cli" --self-test
      - name: Acquire 14 doubled ROM-backed programs and 7 separate explorations
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_10_if_then_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j110-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j110-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j110-cpc"
          python3 tools/j1_10_if_then_verify.py --evidence "$RUNNER_TEMP/j110-cpc"
      - name: Publish original evidence once or compare independent new ROM sessions
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_10_if_then
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j110-cpc/." "$DEST/"
            python3 tools/j1_10_if_then_verify.py --evidence "$DEST" --write-provisional-seal
            python3 tools/j1_10_if_then_verify.py --evidence "$DEST"
            echo "J1.10-A BOT_ARCHIVE_CREATED: independent permanent SHA pins PENDING"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.10-A): archive fourteen doubled original CPC IF THEN sessions"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-10-a-if-then-integer | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo "CONCURRENT_BRANCH_ADVANCE refusing to publish evidence"
              exit 1
            }
            git push origin HEAD:refs/heads/oracle/j1-10-a-if-then-integer
          else
            python3 tools/j1_10_if_then_verify.py --evidence "$DEST" --permanent --self-test
            for name in $(find "$DEST/original" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j110-cpc/original/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j110-cpc/original/$name/run/printer.dat"
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j110-cpc/repeat/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j110-cpc/repeat/$name/run/printer.dat"
              echo "J1.10-A $name INDEPENDENT_REACQUISITION_MATCH_EXACT"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-10-a-cpc-if-then-captures
          path: ${{ runner.temp }}/j110-cpc/
          if-no-files-found: warn
          retention-days: 30
