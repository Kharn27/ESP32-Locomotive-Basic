name: J1.11-A CPC6128 independent GOSUB RETURN oracle

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: j111-gosub-return-cpc-${{ github.head_ref || github.ref }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-cpc-acquisition:
    if: github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-11-a-gosub-return' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Verify true checkout, pinned ROM and immutable code/HW4 boundaries
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -s tests/oracles/caprice32/rom/amsdos.rom
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only | tee "$RUNNER_TEMP/j111-files.txt"
          if grep -E '^(core/|firmware/|video/|hal/|io/|tests/oracles/caprice32|tests/fixtures/cpc6128/)' "$RUNNER_TEMP/j111-files.txt" | grep -v '^tests/fixtures/cpc6128/j1_11_gosub_return/'; then
            echo "J1.11-A CORE_HW4_OLD_ARCHIVES_FORBIDDEN"
            exit 1
          fi
          echo "J1.11-A ORACLE_CHECKOUT_PINNED GHCR_APT_NONE CAPRICE_BUILD_NONE HEAD=$GITHUB_HEAD_SHA"
      - name: Compile unchanged native CLI and execute existing C99 suite
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/j111-c99" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/j111-c99" --parallel 2
          # The first original ROM capture intentionally has no permanent
          # SHA anchors yet. Do not let the fail-closed future gate deadlock
          # the acquisition job; all historical CTests still execute.
          if test -f tests/fixtures/cpc6128/j1_11_gosub_return/manifest.json; then
            ctest --test-dir "$RUNNER_TEMP/j111-c99" --output-on-failure
          else
            ctest --test-dir "$RUNNER_TEMP/j111-c99" --output-on-failure \
              -E '^j1_11_a_gosub_return_cpc_permanent$'
          fi
          python3 tools/j1_9_binary_family_verify.py --permanent --self-test
          python3 tools/j1_9_b_native_verify.py --cli "$RUNNER_TEMP/j111-c99/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/j111-c99/basic_program_image_cli" --self-test
      - name: Acquire 16 doubled ROM-backed GOSUB/RETURN programs
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_11_gosub_return_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j111-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j111-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j111-cpc"
          python3 tools/j1_11_gosub_return_verify.py --evidence "$RUNNER_TEMP/j111-cpc"
      - name: Publish original evidence once or compare independent new ROM sessions
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_11_gosub_return
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j111-cpc/." "$DEST/"
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST" --write-provisional-seal
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST"
            echo "J1.11-A BOT_ARCHIVE_CREATED: independent permanent SHA pins PENDING"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.11-A): archive sixteen doubled original CPC GOSUB RETURN sessions"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-11-a-gosub-return | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo "CONCURRENT_BRANCH_ADVANCE refusing to publish evidence"
              exit 1
            }
            git push origin HEAD:refs/heads/oracle/j1-11-a-gosub-return
          else
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST" --permanent --self-test
            for name in $(find "$DEST/original" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j111-cpc/original/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j111-cpc/original/$name/run/printer.dat"
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j111-cpc/repeat/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j111-cpc/repeat/$name/run/printer.dat"
              echo "J1.11-A $name INDEPENDENT_REACQUISITION_MATCH_EXACT"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-11-a-cpc-gosub-return-captures
          path: ${{ runner.temp }}/j111-cpc/
          if-no-files-found: warn
          retention-days: 30

  original-integrity:
    name: J1.11-A permanent GOSUB-RETURN archive and falsifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Seal and falsification gate without emulator
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_11_gosub_return
          if test -f "$DEST/manifest.json"; then
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST" --permanent --self-test
          elif test "$GITHUB_HEAD_REF" = "oracle/j1-11-a-gosub-return"; then
            echo "J1.11-A ACQUISITION_PENDING / NOT YET PERMANENTLY VERIFIED"
          else
            echo "J1.11-A ORIGINAL_ARCHIVE_MISSING"
            exit 1
          fi

  isolation:
    name: J1.11-A no core / HW4 / old archive modifications
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          set -euo pipefail
          BASE="$(git merge-base origin/main HEAD)"
          if test "$GITHUB_HEAD_REF" = "oracle/j1-11-a-gosub-return"; then
            git diff --exit-code "$BASE" HEAD -- core/ firmware/ video/ hal/ io/
            git diff --exit-code "$BASE" HEAD -- tests/fixtures/cpc6128/j1_integer_binary_family/ tests/fixtures/cpc6128/j1_integer_sub_vars/
          else
            git diff --exit-code "$BASE" HEAD -- tests/fixtures/cpc6128/j1_11_gosub_return/
          fi
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          test ! -e firmware/esp32_loco/CMakeLists.txt
          echo "J1.11-A HW4_CORE_ARCHIVES_ISOLATED"

          fi
          python3 tools/j1_9_binary_family_verify.py --permanent --self-test
          python3 tools/j1_9_b_native_verify.py --cli "$RUNNER_TEMP/j111-c99/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/j111-c99/basic_program_image_cli" --self-test
      - name: Acquire 16 doubled ROM-backed programs and 7 separate explorations
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_11_gosub_return_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j111-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j111-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j111-cpc"
          python3 tools/j1_11_gosub_return_verify.py --evidence "$RUNNER_TEMP/j111-cpc"
      - name: Publish original evidence once or compare independent new ROM sessions
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_11_gosub_return
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j111-cpc/." "$DEST/"
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST" --write-provisional-seal
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST"
            echo "J1.11-A BOT_ARCHIVE_CREATED: independent permanent SHA pins PENDING"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.11-A): archive sixteen doubled original CPC GOSUB RETURN sessions"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-11-a-gosub-return | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo "CONCURRENT_BRANCH_ADVANCE refusing to publish evidence"
              exit 1
            }
            git push origin HEAD:refs/heads/oracle/j1-11-a-gosub-return
          else
            python3 tools/j1_11_gosub_return_verify.py --evidence "$DEST" --permanent --self-test
            for name in $(find "$DEST/original" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j111-cpc/original/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j111-cpc/original/$name/run/printer.dat"
              cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j111-cpc/repeat/$name/program.bin"
              cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j111-cpc/repeat/$name/run/printer.dat"
              echo "J1.11-A $name INDEPENDENT_REACQUISITION_MATCH_EXACT"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-10-a-cpc-gosub-return-captures
          path: ${{ runner.temp }}/j111-cpc/
          if-no-files-found: warn
          retention-days: 30

