name: J1.12-B1 re-acquire sealed FOR NEXT CPC records

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: j112-b1-reacquire-${{ github.head_ref || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  third-pass-rom-independent:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/j1-12-b1-for-next-tokens-list' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact HEAD, pinned Caprice32 ROM and read-only originals
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          ! git diff --name-only origin/main...HEAD | grep -E '^(tests/oracles/inputs/|tests/fixtures/cpc6128/|tests/oracles/caprice32/|tools/j1_12_for_next_verify.py$)'
          echo "J1.12-B1 REACQUIRE_SOURCE_SHA=$EXPECTED_HEAD ROM_PINNED=PASS ARCHIVES_READ_ONLY=PASS"
      - name: Build portable comparator on this exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/j112-b1-c99" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/j112-b1-c99" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/j112-b1-c99" --output-on-failure -R '^j1_12_b1_'
      - name: Re-acquire 20 pairs from independent ROM into temporary storage
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_12_for_next_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j112-b1-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j112-b1-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j112-b1-reacquired"
          python3 tools/j1_12_for_next_verify.py --evidence "$RUNNER_TEMP/j112-b1-reacquired"
          python3 tools/j1_12_for_next_verify.py --permanent --self-test
          DEST=tests/fixtures/cpc6128/j1_12_for_next
          count=0
          for name in $(find "$DEST/original" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
            cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j112-b1-reacquired/original/$name/program.bin"
            cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j112-b1-reacquired/original/$name/run/printer.dat"
            cmp "$DEST/original/$name/program.bin" "$RUNNER_TEMP/j112-b1-reacquired/repeat/$name/program.bin"
            cmp "$DEST/original/$name/run/printer.dat" "$RUNNER_TEMP/j112-b1-reacquired/repeat/$name/run/printer.dat"
            echo "J1.12-B1 $name ROM_REACQUISITION_MATCH_EXACT"
            count=$((count + 1))
          done
          test "$count" -eq 20
          git diff --exit-code -- tests/oracles/inputs/j1_12_a tests/fixtures/cpc6128/j1_12_for_next
          echo "PASS J1.12-B1 20/20 ROM_REACQUISITION_MATCH_EXACT HEAD=$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-12-b1-rom-reacquisition
          path: ${{ runner.temp }}/j112-b1-reacquired/
          if-no-files-found: warn
          retention-days: 30
