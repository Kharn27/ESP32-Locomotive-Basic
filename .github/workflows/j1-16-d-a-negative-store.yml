name: J1.16-D-A CPC REAL5 signed variable-store oracle

on:
  pull_request:
    paths:
      - '.github/workflows/j1-16-d-a-negative-store.yml'
      - 'tools/j1_16_d_a_store.py'
      - 'tests/fixtures/cpc6128/j1_16_d_a_negative_store/**'
      - 'docs/J1.16-D-A-real5-negative-store-oracle.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: j116-da-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rom-store-observation:
    if: (github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-16-d-a-real5-negative-store' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true

      - name: Check pinned checkout, Caprice32, CPC ROM, and forbidden paths
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff origin/main...HEAD --name-only > /tmp/j116-da-paths.txt
          cat /tmp/j116-da-paths.txt
          if grep -E '^(core/|firmware/|video/|hal/|io/|tests/fixtures/cpc6128/j1_16_real5_scalar/|tests/oracles/inputs/|tests/oracles/caprice32/)' /tmp/j116-da-paths.txt; then
            echo 'J1.16-D-A MODIFIED_NATIVE_OR_HISTORICAL_PATH'; exit 1
          fi
          python3 tools/j1_16_d_a_store.py --check-sources
          echo 'J1.16-D-A PINNED_ROM_CPC6128 APT_NONE CAPRICE_BUILD_NONE'

      - name: Acquire two fresh STOP boundary CPC snapshots per witness
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/j1_16_d_a_store.py --caprice tests/oracles/caprice32 --output "$RUNNER_TEMP/j116-da"
          python3 tools/j1_16_d_a_store.py --evidence "$RUNNER_TEMP/j116-da" --self-test
          echo 'J1.16-D-A FRESH_ACQUISITION_VERIFIED (no independent archive pin)'

      - name: Preserve original captures once or compare new independent acquisition
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_16_d_a_negative_store
          if test ! -e "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j116-da/." "$DEST/"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name 'cap32.cfg' \) | grep .
            python3 tools/j1_16_d_a_store.py --evidence "$DEST" --permanent --self-test
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.16-D-A): archive two genuine CPC signed REAL5 store pairs"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-16-d-a-real5-negative-store | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo 'CONCURRENT_BRANCH_ADVANCE: evidence kept as artifact only'; exit 1
            }
            git push origin HEAD:refs/heads/oracle/j1-16-d-a-real5-negative-store
            echo 'J1.16-D-A BOT_ARCHIVE_CREATED'
          else
            python3 tools/j1_16_d_a_store.py --evidence "$DEST" --permanent --self-test
            for case in R_HALF R_NEG_HALF; do
              for session in original repeat; do
                cmp "$DEST/$session/$case/window.bin" "$RUNNER_TEMP/j116-da/$session/$case/window.bin"
              done
              echo "J1.16-D-A $case FRESH_REACQUISITION_MATCH_EXACT"
            done
          fi
      - name: Upload bounded variable and STOP evidence (no complete SNA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j116-da-real5-variable-store
          path: ${{ runner.temp }}/j116-da/
          if-no-files-found: warn
          retention-days: 30
