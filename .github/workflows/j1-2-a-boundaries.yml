name: J1.2-A independent CPC boundary evidence

on:
  pull_request:
    paths:
      - ".github/workflows/j1-2-a-boundaries.yml"
      - "tests/oracles/j1_2_boundary_oracle.py"
      - "tests/oracles/inputs/j1_2_a/**"
      - "tools/j1_2_boundary_verify.py"
      - "tests/fixtures/cpc6128/j1_integer_boundaries/**"
      - "docs/J1.2-A-integer-boundary-oracle.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: j12-boundary-archive
  cancel-in-progress: false

jobs:
  cpc-integer-boundaries:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/j1-2-a-integer-boundary-oracle' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact dedicated branch and pinned submodule
        uses: actions/checkout@v4
        with:
          ref: feat/j1-2-a-integer-boundary-oracle
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Verify pinned Caprice32 and absence of historical mutations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(git ls-tree HEAD tests/oracles/caprice32 | awk '{print $1}')" = "160000"
          git diff origin/main...HEAD --name-only | tee /tmp/j12_changed_files.txt
          if grep -E '^(core/|tests/fixtures/cpc6128/(signed_print|j1_negative_tokens|evidence|token_ram|manifest.json))' /tmp/j12_changed_files.txt; then
            echo "J1.2-A historical/core modification forbidden"
            exit 1
          fi

      - name: Install Caprice32 build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ make pkg-config libsdl2-dev libfreetype6-dev zlib1g-dev libpng-dev xvfb xauth python3

      - name: Compile pinned Caprice32 and confirm system ROM identity
        working-directory: tests/oracles/caprice32
        run: |
          set -euo pipefail
          make -j 2 WITHOUT_GL=1 APP_PATH="$PWD"
          ./cap32 --version
          test "$(sha256sum rom/cpc6128.rom | cut -d ' ' -f 1)" = "31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562"
          test -s rom/amsdos.rom

      - name: Build and test current Linux C99 (no functionality changes)
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/c99-build" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/c99-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/c99-build" --output-on-failure
          python3 tools/j1_signed_assignment_audit.py --cli "$RUNNER_TEMP/c99-build/loco_basic_cli" --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" --self-test

      - name: Acquire six independent pre-RUN LIST and post-RUN CPC sessions
        env:
          GITHUB_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_2_boundary_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/c99-build/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/c99-build/loco_basic_cli" \
            --output "$RUNNER_TEMP/j12-acquisition"
          python3 tools/j1_2_boundary_verify.py \
            --evidence "$RUNNER_TEMP/j12-acquisition"

      - name: Seal original acquisition once, or verify full independent binary reproducibility
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_integer_boundaries
          if [ ! -e "$DEST/manifest.json" ]; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j12-acquisition/." "$DEST/"
            python3 tools/j1_2_boundary_verify.py --evidence "$DEST" --write-provisional-seal --permanent --self-test
            if find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .; then
              echo "refusing a full machine/ROM archive"
              exit 1
            fi
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.2-A): archive six original CPC RAM and RUN captures"
            git push origin HEAD:feat/j1-2-a-integer-boundary-oracle
          else
            python3 tools/j1_2_boundary_verify.py --evidence "$DEST" --permanent --self-test
            for name in P255 P256 PMAX N255 N256 NMIN; do
              cmp "$DEST/$name/program.bin" "$RUNNER_TEMP/j12-acquisition/$name/program.bin"
              sha256sum "$RUNNER_TEMP/j12-acquisition/$name/program.bin"
              echo "$name REPRODUCED"
            done
          fi

      - name: Archive raw CPC proof; NO ROM and NO SNA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j1-2-a-original-cpc-boundaries
          path: ${{ runner.temp }}/j12-acquisition/
          if-no-files-found: warn
          retention-days: 30
