name: J1.2-B INTEGER16 CPC native differential

on:
  pull_request:
    paths:
      - "core/basic_tokenizer.c"
      - "core/basic_listing.c"
      - "core/basic_executor.c"
      - "core/basic_executor.h"
      - "tests/test_basic_integer16.c"
      - "tests/test_basic_integer_assignment_tokens.c"
      - "tests/test_basic_integer_assignment_runtime.c"
      - "tests/oracles/j1_native_capabilities.json"
      - "tools/j0_post_c1_audit.py"
      - "tools/j1_signed_assignment_audit.py"
      - "tools/j1_2_b_native_verify.py"
      - ".github/workflows/j1-2-b-integer16.yml"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  j1-2-b-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sanitizers: [OFF, ON]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard original CPC J1.2-A and prior independent archives
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only origin/main...HEAD | tee /tmp/changes.txt
          # On the explicitly authorized J1.10-A oracle branch only, allow
          # creation of its NEW archive; preserve every older CPC proof.
          if test "$GITHUB_HEAD_REF" = "oracle/j1-10-a-if-then-integer"; then
            if grep -E '^(tests/fixtures/cpc6128/|tests/oracles/inputs/j1_2_a/|tools/j1_2_boundary_verify.py|tests/oracles/j1_2_boundary_oracle.py)' /tmp/changes.txt | grep -v '^tests/fixtures/cpc6128/j1_10_if_then/'; then
              echo "J1.2-B historical fixture was modified"
              exit 1
            fi
            python3 tools/j1_10_if_then_verify.py --permanent --self-test
          elif test "$GITHUB_HEAD_REF" = "oracle/j1-11-a-gosub-return"; then
            # A new, independently pinned corpus is added; not one old byte
            # of J1.2-A or any historical oracle may be modified.
            if grep -E '^(tests/fixtures/cpc6128/|tests/oracles/inputs/j1_2_a/|tools/j1_2_boundary_verify.py|tests/oracles/j1_2_boundary_oracle.py)' /tmp/changes.txt | grep -v '^tests/fixtures/cpc6128/j1_11_gosub_return/'; then
              echo "J1.11-A HISTORICAL_ORACLE_CHANGED"
              exit 1
            fi
            python3 tools/j1_11_gosub_return_verify.py --permanent --self-test
          else
            if grep -E '^(tests/fixtures/cpc6128/|tests/oracles/inputs/j1_2_a/|tools/j1_2_boundary_verify.py|tests/oracles/j1_2_boundary_oracle.py)' /tmp/changes.txt; then
              echo "J1.2-B must not rewrite J1.2-A or any earlier history"
              exit 1
            fi
          fi
      - name: Configure native C99
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBP_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build native C99
        run: cmake --build build --parallel 2
      - name: Run all regression suites and both oracles
        run: ctest --test-dir build --output-on-failure
      - name: Publish five original CPC SHA and native evidence side-by-side
        run: |
          set -euo pipefail
          python3 tools/j1_2_boundary_verify.py --permanent --self-test
          python3 tools/j1_2_b_native_verify.py --cli build/loco_basic_cli \
            --image-cli build/basic_program_image_cli --self-test
