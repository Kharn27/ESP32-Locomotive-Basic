name: J1.24-A independent CPC WHILE WEND oracle

on:
  pull_request:
    paths:
      - "tools/j1_24_a_while_wend_evidence.py"
      - "tests/test_j1_24_a_while_wend_oracle.py"
      - "tests/fixtures/cpc6128/j1_24_a_while_wend/**"
      - "docs/J1.24-A-while-wend-cpc-oracle.md"
      - ".github/workflows/j1-24-a-while-wend.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: j124a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  cpc-original-repeat:
    if: github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-24-a-while-wend-cpc' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
      - name: Enforce base, immutable ROM, tools, and isolated diff
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 355b9bd67ba8970abafcf67978854cebcb878273 HEAD
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d' ' -f1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff --name-only 355b9bd67ba8970abafcf67978854cebcb878273 HEAD >/tmp/j124-changed
          if grep -Ev '^(tools/j1_24_a_while_wend_evidence.py|tests/test_j1_24_a_while_wend_oracle.py|tests/fixtures/cpc6128/j1_24_a_while_wend/|docs/J1.24-A-while-wend-cpc-oracle.md|.github/workflows/j1-24-a-while-wend.yml)' /tmp/j124-changed; then
            echo "OUT_OF_SCOPE_DIFF"; exit 1
          fi
          python3 -m py_compile tools/j1_24_a_while_wend_evidence.py
          python3 tools/j1_24_a_while_wend_evidence.py --check --self-test
          python3 -m unittest discover -s tests -p test_j1_24_a_while_wend_oracle.py -v
      - name: Acquire original/repeat CPC evidence or verify committed archive
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_24_a_while_wend
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            python3 tools/j1_24_a_while_wend_evidence.py \
              --acquire tests/oracles/caprice32 --output "$RUNNER_TEMP/j124a" \
              --head "$EXPECTED_HEAD"
            python3 tools/j1_24_a_while_wend_evidence.py \
              --verify "$RUNNER_TEMP/j124a" --self-test
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j124a/." "$DEST/"
            ! find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name 'cap32.cfg' \) | grep .
            python3 tools/j1_24_a_while_wend_evidence.py --verify "$DEST" --self-test
            sha256sum "$DEST/manifest.json"
            git config user.name loco-cyd-evidence-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add "$DEST"
            git commit -m 'evidence(J1.24-A): authentic CPC6128 WHILE WEND original/repeat'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-24-a-while-wend-cpc | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$EXPECTED_HEAD" || { echo CONCURRENT_HEAD_ADVANCE; exit 1; }
            git push origin HEAD:refs/heads/oracle/j1-24-a-while-wend-cpc
          else
            python3 tools/j1_24_a_while_wend_evidence.py --verify "$DEST" --self-test
            echo "ORIGINAL_REPEAT_ARCHIVE_PRESENT_AND_INTERNALLY_VERIFIED"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j124-while-wend-original-repeat
          path: ${{ runner.temp }}/j124a/
          retention-days: 30
          if-no-files-found: ignore
