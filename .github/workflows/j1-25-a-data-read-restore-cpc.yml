name: J1.25-A independent DATA READ RESTORE CPC oracle

on:
  pull_request:
    paths:
      - 'tools/j1_25_a_data_read_restore_evidence.py'
      - 'tests/oracles/inputs/j1_25_a/**'
      - 'tests/fixtures/cpc6128/j1_25_a_data_read_restore/**'
      - 'docs/J1.25-A-data-read-restore-cpc-oracle.md'
      - '.github/workflows/j1-25-a-data-read-restore-cpc.yml'
  push:
    branches: [main]
    paths:
      - 'tools/j1_25_a_data_read_restore_evidence.py'
      - 'tests/oracles/inputs/j1_25_a/**'
      - 'tests/fixtures/cpc6128/j1_25_a_data_read_restore/**'
      - '.github/workflows/j1-25-a-data-read-restore-cpc.yml'

permissions:
  contents: read
  packages: read

# Never cancel a committed independent acquisition midway.
concurrency:
  group: j125-a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-and-seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
      - name: Fail closed on source drift; no fabricated CPC oracle pass
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/j1_25_a_data_read_restore_evidence.py
          python3 tools/j1_25_a_data_read_restore_evidence.py --check --self-test
          DEST=tests/fixtures/cpc6128/j1_25_a_data_read_restore
          if test -f "$DEST/manifest.json"; then
            python3 tools/j1_25_a_data_read_restore_evidence.py \
              --verify "$DEST" --permanent --self-test
          else
            test ! -e "$DEST"
            echo "J1.25-A NO_CPC_ARCHIVE_YET — SOURCE_ONLY; CPC_ORACLE_UNVERIFIED"
          fi

  independent-acquisition:
    if: github.event_name == 'pull_request' && github.head_ref == 'oracle/j1-25-a-data-read-restore-cpc' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Verify immutable actual CPC ROM, source, run HEAD and scope
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor c8cec8b1b4d0cab553cdc8b97b751aef3dd1370d HEAD
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d' ' -f1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          git diff --name-only c8cec8b1b4d0cab553cdc8b97b751aef3dd1370d HEAD | tee /tmp/j125-a-scope.txt
          if grep -Ev '^((tools/j1_25_a_data_read_restore_evidence.py)|(tests/oracles/inputs/j1_25_a/.*)|(tests/fixtures/cpc6128/j1_25_a_data_read_restore/.*)|(docs/J1.25-A-data-read-restore-cpc-oracle.md)|(.github/workflows/j1-25-a-data-read-restore-cpc.yml)|(.github/workflows/ci-cpc-permanent.yml))$' /tmp/j125-a-scope.txt; then
            echo 'J1.25-A FORBIDDEN_SCOPE_DIFF'; exit 1
          fi
          python3 -m py_compile tools/j1_25_a_data_read_restore_evidence.py
          python3 tools/j1_25_a_data_read_restore_evidence.py --check --self-test
      - name: Capture 24 independent CPC observations or verify already externally sealed fixtures
        shell: bash
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_25_a_data_read_restore
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            python3 tools/j1_25_a_data_read_restore_evidence.py \
              --acquire tests/oracles/caprice32 \
              --output "$RUNNER_TEMP/j125-a" --head "$EXPECTED_HEAD"
            python3 tools/j1_25_a_data_read_restore_evidence.py \
              --verify "$RUNNER_TEMP/j125-a" --self-test
            echo "J125_EXTERNAL_ORIGINAL_MANIFEST_SHA256=$(sha256sum "$RUNNER_TEMP/j125-a/manifest.json" | cut -d' ' -f1)"
            echo "J125_EXTERNAL_ACQUISITION_HEAD=$EXPECTED_HEAD"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j125-a/." "$DEST/"
            if find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' -o -name '*.cfg' \) | grep .; then
              echo 'FORBIDDEN_ROM_SNA_DSK_CFG_ARCHIVED'; exit 1
            fi
            sha256sum "$DEST/manifest.json"
            git config user.name 'loco-cyd-evidence-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$DEST"
            git commit -m 'evidence(J1.25-A): archive 24 genuine CPC6128 DATA READ RESTORE sessions'
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/j1-25-a-data-read-restore-cpc | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$EXPECTED_HEAD" || { echo 'CONCURRENT_HEAD_ADVANCE_NO_PUSH'; exit 1; }
            git push origin HEAD:refs/heads/oracle/j1-25-a-data-read-restore-cpc
            echo 'J1.25-A ACQUIRED_UNSEALED — EXTERNAL_ANCHOR_AND_REVIEW_STILL_REQUIRED'
          else
            python3 tools/j1_25_a_data_read_restore_evidence.py \
              --verify "$DEST" --permanent --self-test
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j125-a-cpc-real-24-session-acquisition
          path: ${{ runner.temp }}/j125-a/
          retention-days: 30
          if-no-files-found: ignore
