name: J1.5-A independent CPC INTEGER division

on:
  pull_request:
    paths:
      - ".github/workflows/j1-5-a-division.yml"
      - "tests/oracles/j1_5_division_oracle.py"
      - "tests/oracles/inputs/j1_5_a/**"
      - "tools/j1_5_division_verify.py"
      - "tests/fixtures/cpc6128/j1_integer_division/**"
      - "docs/J1.5-A-integer-division-oracle.md"
      - "docs/ROADMAP_GATES.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: j15-division-original-archive
  cancel-in-progress: false

jobs:
  cpc-division:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/j1-5-a-integer-division-oracle' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact immutable PR commit and ROM-containing submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Pin checkout / emulator / original ROM / allowed source diff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = "31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562"
          test -s tests/oracles/caprice32/rom/amsdos.rom
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          tests/oracles/caprice32/cap32 --version
          git diff origin/main...HEAD --name-only | tee "$RUNNER_TEMP/j15-files.txt"
          if grep -E '^(core/|firmware/|tests/oracles/caprice32|tests/fixtures/cpc6128/)' "$RUNNER_TEMP/j15-files.txt" | grep -v '^tests/fixtures/cpc6128/j1_integer_division/'; then
            echo "FORBIDDEN CORE/HARDWARE/HISTORICAL ARCHIVE DIFF"
            exit 1
          fi
          echo "J1.5-A GHCR_PINNED APT=NONE CAPRICE_BUILD=NONE HEAD=$GITHUB_HEAD_SHA"

      - name: Build unchanged portable C99 comparator and CTest
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/j15-c99" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/j15-c99" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/j15-c99" --output-on-failure

      - name: Verify immutable J1.4-A CPC multiplication archive and all negative falsifications
        run: |
          set -euo pipefail
          python3 tools/j1_4_multiplication_verify.py --permanent --self-test
          echo "J1.4-A HISTORICAL_ARCHIVE_VERIFIED NO_MODIFICATIONS"

      - name: Acquire twelve fresh ROM-backed LIST/RAM and RUN/printer CPC sessions
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_5_division_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j15-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j15-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j15-cpc"
          python3 tools/j1_5_division_verify.py --evidence "$RUNNER_TEMP/j15-cpc"

      - name: Archive authentic captures once, or independently reproduce permanent images
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_integer_division
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j15-cpc/." "$DEST/"
            python3 tools/j1_5_division_verify.py --evidence "$DEST" --write-provisional-seal --permanent --self-test
            if find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .; then
              echo "FORBIDDEN ROM OR WHOLE SNAPSHOT"
              exit 1
            fi
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.5-A): archive twelve original CPC division sessions"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/feat/j1-5-a-integer-division-oracle | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo "CONCURRENT_BRANCH_ADVANCE refusing to push archived evidence"
              exit 1
            }
            git push origin HEAD:refs/heads/feat/j1-5-a-integer-division-oracle
          else
            python3 tools/j1_5_division_verify.py --evidence "$DEST" --permanent --self-test
            for name in P6_ID3 P7_ID2 P5_ID2 N7_ID2 N5_ID2 NMIN_ID1 PMAX_ID1 PMAX_ID2 P1_ID0 P0_ID0 P255_ID255 P2_ID255; do
              cmp "$DEST/$name/program.bin" "$RUNNER_TEMP/j15-cpc/$name/program.bin"
              cmp "$DEST/$name/run/printer.dat" "$RUNNER_TEMP/j15-cpc/$name/run/printer.dat"
              echo "J1.5-A $name REPRODUCED"
            done
          fi

      - name: Export CPC evidence, never ROMs or complete SNA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j1-4-a-original-cpc-division
          path: ${{ runner.temp }}/j15-cpc/
          if-no-files-found: warn
          retention-days: 30
