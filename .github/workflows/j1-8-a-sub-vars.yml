name: J1.8-A independent CPC INTEGER variable subtraction

on:
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: j18-sub-vars-original-archive
  cancel-in-progress: false

jobs:
  cpc-sub-vars:
    permissions:
      contents: write
      packages: read
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/j1-8-a-cpc-integer-sub-vars-oracle' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact immutable PR commit and ROM-containing submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true

      - name: Pin checkout / emulator / original ROM / allowed source diff
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = "8c778bf072a06fb7c23b9cccd179041db7f79a52"
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f 1)" = "31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562"
          test -s tests/oracles/caprice32/rom/amsdos.rom
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          tests/oracles/caprice32/cap32 --version
          git diff origin/main...HEAD --name-only | tee "$RUNNER_TEMP/j18-files.txt"
          if grep -E '^(core/|firmware/|tests/oracles/caprice32|tests/fixtures/cpc6128/)' "$RUNNER_TEMP/j18-files.txt" | grep -v '^tests/fixtures/cpc6128/j1_integer_sub_vars/'; then
            echo "FORBIDDEN CORE/HARDWARE/HISTORICAL ARCHIVE DIFF"
            exit 1
          fi
          echo "J1.8-A GHCR_PINNED APT=NONE CAPRICE_BUILD=NONE HEAD=$GITHUB_HEAD_SHA"

      - name: Build unchanged portable C99 comparator and CTest
        run: |
          set -euo pipefail
          cmake -S . -B "$RUNNER_TEMP/j18-c99" -DBP_SANITIZERS=OFF
          cmake --build "$RUNNER_TEMP/j18-c99" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/j18-c99" --output-on-failure

      - name: Recheck sealed J1.5-A oracle and J1.5-B native F9 without changing them
        run: |
          set -euo pipefail
          python3 tools/j1_5_division_verify.py --permanent --self-test
          python3 tools/j1_5_b_native_verify.py \
            --cli "$RUNNER_TEMP/j18-c99/loco_basic_cli" \
            --image-cli "$RUNNER_TEMP/j18-c99/basic_program_image_cli" --self-test
          python3 tools/j1_6_mod_verify.py --permanent --self-test
          python3 tools/j1_7_add_vars_verify.py --permanent --self-test
          echo "J1.5-A/J1.5-B/J1.6-A/J1.7-A historical contracts rechecked"

      - name: Verify immutable J1.4-A CPC multiplication archive and all negative falsifications
        run: |
          set -euo pipefail
          python3 tools/j1_4_multiplication_verify.py --permanent --self-test
          echo "J1.4-A HISTORICAL_ARCHIVE_VERIFIED NO_MODIFICATIONS"

      - name: Acquire twelve fresh five-line LIST/RAM and RUN/printer CPC sessions
        run: |
          set -euo pipefail
          python3 tests/oracles/j1_8_sub_vars_oracle.py \
            --caprice tests/oracles/caprice32 \
            --image-cli "$RUNNER_TEMP/j18-c99/basic_program_image_cli" \
            --native-cli "$RUNNER_TEMP/j18-c99/loco_basic_cli" \
            --output "$RUNNER_TEMP/j18-cpc"
          python3 tools/j1_8_sub_vars_verify.py --evidence "$RUNNER_TEMP/j18-cpc"

      - name: Archive authentic captures once, or independently reproduce permanent images
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_integer_sub_vars
          if test ! -f "$DEST/manifest.json"; then
            test ! -e "$DEST"
            mkdir -p "$DEST"
            cp -a "$RUNNER_TEMP/j18-cpc/." "$DEST/"
            python3 tools/j1_8_sub_vars_verify.py --evidence "$DEST" --write-provisional-seal
            echo "J1.8-A ORIGINAL_CAPTURE_UNSEALED_EXTERNALLY: anchors pending, permanent verification gated"
            if find "$DEST" -type f \( -name '*.sna' -o -name '*.rom' -o -name '*.dsk' \) | grep .; then
              echo "FORBIDDEN ROM OR WHOLE SNAPSHOT"
              exit 1
            fi
            git config user.name "loco-cyd-evidence-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$DEST"
            git commit -m "evidence(J1.8-A): archive twelve original CPC variable-sub sessions"
            REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/feat/j1-8-a-cpc-integer-sub-vars-oracle | awk '{print $1}')"
            test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA" || {
              echo "CONCURRENT_BRANCH_ADVANCE refusing to push archived evidence"
              exit 1
            }
            git push origin HEAD:refs/heads/feat/j1-8-a-cpc-integer-sub-vars-oracle
          else
            python3 tools/j1_8_sub_vars_verify.py --evidence "$DEST" --permanent --self-test
            for source in tests/oracles/inputs/j1_8_a/*.bas; do
              name="${source##*/}"
              name="${name%.bas}"
              name="${name^^}"
              cmp "$DEST/$name/program.bin" "$RUNNER_TEMP/j18-cpc/$name/program.bin"
              cmp "$DEST/$name/run/printer.dat" "$RUNNER_TEMP/j18-cpc/$name/run/printer.dat"
              echo "J1.8-A $name REPRODUCED"
            done
          fi

      - name: Export CPC evidence, never ROMs or complete SNA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j1-8-a-original-cpc-sub-vars
          path: ${{ runner.temp }}/j18-cpc/
          if-no-files-found: warn
          retention-days: 30

  permanent-sub-vars-evidence:
    name: J1.8-A permanent integrity and falsification (no emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify original CPC bytes and provisional seal, including 18 negative cases + fake checkout
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/j1_integer_sub_vars
          if test -f "$DEST/manifest.json"; then
            python3 tools/j1_8_sub_vars_verify.py --evidence "$DEST" --permanent --self-test
          elif test "$GITHUB_HEAD_REF" = feat/j1-8-a-cpc-integer-sub-vars-oracle; then
            echo "ACQUISITION_PENDING: the original archive is created by cpc-sub-vars job"
          else
            echo "MISSING PERMANENT J1.8-A ORIGINAL ARCHIVE"
            exit 1
          fi

  hw4-c1-architecture:
    name: J1.8-A verify unchanged BASIC-to-TFT bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify isolated oracle diff and unique LCD/firmware entry point
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          # The original J1.8-A acquisition is oracle-only; independent
          # later native J1 branches may touch core, never the sealed corpus
          # or firmware/HW4. Preserve the stricter original branch guard.
          if test "$GITHUB_HEAD_REF" = feat/j1-8-a-cpc-integer-sub-vars-oracle; then
            git diff --exit-code "$base" HEAD -- core/ video/ hal/
          else
            git diff --exit-code "$base" HEAD -- firmware/ video/ hal/ tests/fixtures/cpc6128/j1_integer_sub_vars/
          fi
          test "$(grep -RlE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]|esp_lcd_new_panel_ili9341[()]' firmware --include='*.c' | wc -l)" -eq 1
          ! grep -RE 'spi_bus_initialize[()]|esp_lcd_panel_draw_bitmap[()]' firmware/esp32_display_probe/main --include='*.c'
          test "$(grep -c '^void app_main(void)' firmware/esp32_display_probe/main/hw4_c2_console.c)" -eq 1
          ! grep -R 'esp_lcd_new_panel_ili9341' firmware/esp32_display_probe/main/
          echo "J1.8-A HW4-C1_BRIDGE_AND_CORE_UNCHANGED"

  xtensa-three-targets:
    name: J1.8-A three independent Xtensa IDF 5.5.6 images
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build BASIC probe and display console ON / HW3 OFF (two projects)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/project" -w /project \
            -e IDF_GIT_SAFE_DIR=/project espressif/idf:v5.5.6 bash -lc '
              set -euo pipefail
              for app in esp32_probe esp32_display_probe; do
                cd /project/firmware/"$app"
                mkdir -p reports
                idf.py --version | tee reports/idf-version.txt
                idf.py --version | grep -Fx "ESP-IDF v5.5.6"
                idf.py set-target esp32 2>&1 | tee reports/set-target.log
                idf.py build 2>&1 | tee reports/build.log
                idf.py size 2>&1 | tee reports/size.txt
                idf.py size-components 2>&1 | tee reports/size-components.txt
                ls -lh build/*.bin build/*.elf | tee reports/images.txt
                echo "J1.8-A THREE_TARGETS_BUILT $app"
              done
              # Historical HW3 mode lives in the SAME display-probe project.
              cd /project/firmware/esp32_display_probe
              mkdir -p reports/j18-hw3-off
              idf.py -B build-j18-hw3 -DHW4_C2_CONSOLE=OFF set-target esp32 2>&1 | tee reports/j18-hw3-off/set-target.log
              idf.py -B build-j18-hw3 -DHW4_C2_CONSOLE=OFF build 2>&1 | tee reports/j18-hw3-off/build.log
              idf.py -B build-j18-hw3 size 2>&1 | tee reports/j18-hw3-off/size.txt
              test "$(xtensa-esp-elf-nm --defined-only build-j18-hw3/loco_esp32_display_probe.elf | grep -Ec " [TW] app_main$")" -eq 1
              echo "J1.8-A HW3_OFF_SINGLE_APP_MAIN=PASS"
            '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: j1-8-a-three-targets
          retention-days: 30
          if-no-files-found: warn
          path: |
            firmware/esp32_probe/reports/
            firmware/esp32_display_probe/reports/
