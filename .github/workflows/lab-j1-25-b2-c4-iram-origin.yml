# LAB_ONLY_NEVER_MERGE — J1.25-B2-C4 #338
# Does not change or bypass historical RENDER-A.
name: LAB J1.25-B2-C4 origin-of-220B strict SPI40
on:
  push:
    branches:
      - lab/j1-25-b2-c4-iram-origin
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lab-j1-25-b2-c4-origin
  cancel-in-progress: false

jobs:
  two-clean-e500-builds:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pinned main, source refs, scripts and historical gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # C4-R1 #338: accept *only* the known CLK-03 tip; no descendant.
          EXPECTED_MAIN=03f83c39e6f9ed4daeddb1ed93a989a35d726e30
          PREVIOUS_MAIN=ae07e039a08f6fff66f752228dc2ebed3fcf4220
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "C4_R1_REMOTE_MAIN=$REMOTE_MAIN"
          echo "C4_R1_APPROVED_MAIN=$EXPECTED_MAIN PREVIOUS_MAIN=$PREVIOUS_MAIN"
          test "$REMOTE_MAIN" = "$EXPECTED_MAIN" || {
            echo "STOP: main differs from the exact C4-R1 authorized CLK-03 tip"; exit 6;
          }
          git cat-file -e "$EXPECTED_MAIN^{commit}"
          test "$(git rev-parse "$EXPECTED_MAIN^")" = "$PREVIOUS_MAIN" || {
            echo "STOP: CLK-03 must have the exact previously approved parent"; exit 7;
          }
          test "$(git merge-base "$PREVIOUS_MAIN" "$EXPECTED_MAIN")" = "$PREVIOUS_MAIN"
          test "$(git rev-list --count "$PREVIOUS_MAIN..$EXPECTED_MAIN")" = 1
          git show --no-patch --format='C4_R1_APPROVED_COMMIT=%H%nC4_R1_PARENTS=%P%nC4_R1_SUBJECT=%s' "$EXPECTED_MAIN"
          # Assert exact filename/status allowlist; no broad subdirectory wildcard.
          EXPECTED_DIFF="$(cat <<'CLK03_ALLOWED_DIFF'
          A	.github/workflows/clk-03-acquisition.yml
          A	docs/CLK-03-cpc-time-oracle.md
          A	tests/fixtures/cpc6128/clk_03_time/corpus.json
          A	tests/test_clk_03_time.py
          M	tools/ci/opt3_routing.py
          A	tools/clk_03_cpc_time.py
          CLK03_ALLOWED_DIFF
          )"
          ACTUAL_DIFF="$(git diff --name-status "$PREVIOUS_MAIN" "$EXPECTED_MAIN")"
          printf 'C4_R1_CLK03_DIFF_START\n%s\nC4_R1_CLK03_DIFF_END\n' "$ACTUAL_DIFF"
          test "$ACTUAL_DIFF" = "$EXPECTED_DIFF" || {
            echo "STOP: unexpected path or status in CLK-03"; exit 8;
          }
          git diff --stat "$PREVIOUS_MAIN" "$EXPECTED_MAIN"
          git diff --check "$PREVIOUS_MAIN" "$EXPECTED_MAIN"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN" || {
            echo "STOP: main advanced during C4-R1 provenance verification"; exit 6;
          }
          echo "C4_R1_EXACT_CLK03_MAIN_AND_SIX_FILE_DIFF=PASS"
          git cat-file -e e500864b3be612a325559259250f41cc35b5252b^{commit}
          git cat-file -e e0085a9e2d3b601359fc44fcfa3ea83430fc7056^{commit}
          bash -n tools/lab/j1_25_b2_c4_build.sh
          python3 -m py_compile tools/lab/j1_25_b2_c4_analyze.py
          test "$(git show ae07e039a08f6fff66f752228dc2ebed3fcf4220:tools/ci/hw4_render_a_memory.py | sha256sum | cut -d' ' -f1)" = "$(sha256sum tools/ci/hw4_render_a_memory.py | cut -d' ' -f1)"
          echo "C4_PINS_AND_GATE_UNCHANGED=PASS"
      - name: e500 at 40 MHz, two cold ESP-IDF builds (C3 Docker digest)
        run: bash tools/lab/j1_25_b2_c4_build.sh e500
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: c4-spi40-e500
          retention-days: 30
          if-no-files-found: warn
          path: reports/c4/

  analysis-and-gate:
    needs: two-clean-e500-builds
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve C4 new e500 repetitions
        uses: actions/download-artifact@v4.3.0
        with:
          name: c4-spi40-e500
          path: reports/c4
      - name: Reuse C3 main e008 repetitions
        continue-on-error: true
        uses: actions/download-artifact@v4.3.0
        with:
          name: c3-spi40-main_e008
          run-id: 42239047408
          github-token: ${{ github.token }}
          path: reports/c3
      - name: Reuse C3 immutable RENDER-A reference
        continue-on-error: true
        uses: actions/download-artifact@v4.3.0
        with:
          name: c3-spi40-ref
          run-id: 42239047408
          github-token: ${{ github.token }}
          path: reports/c3
      - name: Qualify C3 e008 build for comparison
        id: qualify
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p reports/c4-summary
          python3 tools/lab/j1_25_b2_c4_analyze.py --qualify-only 2>&1 | tee reports/c4-summary/qualification.log
          rc=${PIPESTATUS[0]}
          case "$rc" in
            0) echo "fallback=false" >> "$GITHUB_OUTPUT";;
            3) echo "fallback=true" >> "$GITHUB_OUTPUT";;
            *) echo "MEASUREMENT_INVALID qualification rc=$rc"; exit "$rc";;
          esac
      - name: ONLY IF C3 impossible, two clean e008 builds
        if: steps.qualify.outputs.fallback == 'true'
        shell: bash
        run: bash tools/lab/j1_25_b2_c4_build.sh main_e008
      - name: Comparative Xtensa diagnostics and historical gate (unaltered)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lab/j1_25_b2_c4_analyze.py | tee reports/c4-summary/analysis.log
          cat reports/c4-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: c4-spi40-diagnostic
          retention-days: 30
          if-no-files-found: warn
          path: |
            reports/c4-summary/
            reports/c4/main_e008/
