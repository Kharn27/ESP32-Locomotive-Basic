name: HW4-DIAG-ORACLE-R1 independent CPC6128 direct unknown words
on:
  pull_request:
    paths:
      - 'tools/hw4_diag_oracle_r1_cpc.py'
      - 'tools/hw4_diag_oracle_r1_verify.py'
      - 'docs/HW4-DIAG-ORACLE-R1.md'
      - '.github/workflows/hw4-diag-oracle-r1.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: hw4-diag-oracle-r1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  acquire-independent-cpc:
    if: github.head_ref == 'oracle/hw4-diag-oracle-r1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/kharn27/esp32-locomotive-basic-caprice32@sha256:7c2ac82df92a2df5c7305cc0bd70dc95124249fb46b2d893449f3d48395ced8c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Verify exact PR head and immutable independent CPC ROM/emulator
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/tests/oracles/caprice32"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          test "$(git -C tests/oracles/caprice32 rev-parse HEAD)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(cat /usr/local/share/loco-caprice32-source.sha)" = 8c778bf072a06fb7c23b9cccd179041db7f79a52
          test "$(sha256sum tests/oracles/caprice32/rom/cpc6128.rom | cut -d ' ' -f1)" = 31c3668c67bea027dab698ece233c9434d9324f9ba7dac84db58f400b6689562
          test -x /usr/local/bin/cap32
          cp /usr/local/bin/cap32 tests/oracles/caprice32/cap32
          tests/oracles/caprice32/cap32 --version
          python3 -m py_compile tools/hw4_diag_oracle_r1_cpc.py tools/hw4_diag_oracle_r1_verify.py
          python3 tools/hw4_diag_oracle_r1_cpc.py --self-test
          python3 tools/hw4_diag_oracle_r1_verify.py --self-test
      - name: Detect immutable pre-existing originals
        id: saved
        run: |
          if test -e tests/fixtures/cpc6128/hw4_diag_oracle_r1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            python3 tools/hw4_diag_oracle_r1_verify.py --evidence tests/fixtures/cpc6128/hw4_diag_oracle_r1 --self-test
            echo 'R1_ALREADY_ARCHIVED_NO_OVERWRITE'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire four fresh CPC processes (LISTT and RUNN, each twice)
        if: steps.saved.outputs.exists == 'false'
        run: |
          set -euo pipefail
          python3 tools/hw4_diag_oracle_r1_cpc.py --caprice tests/oracles/caprice32 --output /tmp/hw4-diag-oracle-r1
          python3 tools/hw4_diag_oracle_r1_verify.py --evidence /tmp/hw4-diag-oracle-r1 --self-test
          sha256sum /tmp/hw4-diag-oracle-r1/manifest.json
      - name: Upload candidates before any attempt to push
        if: always() && steps.saved.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: hw4-diag-oracle-r1-candidates-${{ github.run_id }}
          path: /tmp/hw4-diag-oracle-r1/
          retention-days: 30
          if-no-files-found: warn
      - name: Archive originals on dedicated PR branch only, with anti-race HEAD lease
        if: success() && steps.saved.outputs.exists == 'false'
        run: |
          set -euo pipefail
          DEST=tests/fixtures/cpc6128/hw4_diag_oracle_r1
          test ! -e "$DEST"
          REMOTE_HEAD="$(git ls-remote --exit-code origin refs/heads/oracle/hw4-diag-oracle-r1 | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_HEAD_SHA"
          cp -a /tmp/hw4-diag-oracle-r1 "$DEST"
          python3 tools/hw4_diag_oracle_r1_verify.py --evidence "$DEST" --self-test
          ! find "$DEST" -type f \( -name '*.rom' -o -name '*.sna' -o -name '*.dsk' \) | grep .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'evidence(HW4-DIAG-ORACLE-R1): archive 4 raw CPC6128 screens and SHA manifest'
          test "$(git ls-remote --exit-code origin refs/heads/oracle/hw4-diag-oracle-r1 | cut -f1)" = "$GITHUB_HEAD_SHA"
          git push origin HEAD:refs/heads/oracle/hw4-diag-oracle-r1
          echo 'R1_ORIGINAL_CPC_SCREEN_BYTES_ARCHIVED_BRANCH_ONLY_NO_VERDICT'
